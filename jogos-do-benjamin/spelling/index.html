<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spelling Bee">
<meta name="robots" content="noindex">
<title>Spelling Bee do Benjamin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<style>
  :root { --mel: #facc15; --mel2: #f59e0b; --tinta: #1c1917; --papel: #fffbeb; --verde: #16a34a; --vermelho: #dc2626; --cinza: #78716c; --borda: #e7e5e4; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { background: var(--papel); color: var(--tinta); font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-size: 17px; min-height: 100%; }
  body { padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
  button { font-family: inherit; font-size: inherit; color: inherit; border: none; background: none; cursor: pointer; display: block; }
  #topo { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--tinta); color: #fff; }
  #logo { font-size: 30px; line-height: 1; user-select: none; -webkit-user-select: none; touch-action: none; }
  #topo h1 { font-size: 18px; flex: 1; line-height: 1.15; }
  #topo h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--mel); }
  .chip { background: rgba(255,255,255,.14); color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 15px; font-weight: 700; }
  #palco { max-width: 560px; margin: 0 auto; padding: 14px 16px; }
  .cartao { background: #fff; border: 2px solid var(--borda); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .plano { background: var(--tinta); color: #fff; border: none; }
  .plano h2 { font-size: 15px; color: var(--mel); letter-spacing: .04em; text-transform: uppercase; }
  .plano p { margin-top: 4px; font-size: 16px; line-height: 1.4; }
  .passos { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .passo { background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 10px; font-size: 14px; font-weight: 700; }
  .passo.feito { background: var(--verde); }
  .grande { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--borda); border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 3px 0 var(--borda); }
  .grande:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--borda); }
  .grande .ic { font-size: 34px; width: 44px; text-align: center; flex: none; }
  .grande b { display: block; font-size: 18px; }
  .grande span { display: block; font-size: 14px; color: var(--cinza); margin-top: 2px; }
  .grande.hoje { border-color: var(--mel2); box-shadow: 0 3px 0 var(--mel2); background: #fef9c3; }
  .grande .barra { height: 8px; background: #f5f5f4; border-radius: 9px; margin-top: 6px; overflow: hidden; }
  .grande .barra i { display: block; height: 100%; background: var(--mel2); border-radius: 9px; }
  .grande .txt { flex: 1; min-width: 0; }
  .favo-link { font-size: 14px; font-weight: 700; color: var(--mel2); padding: 8px; }
  .linha { display: flex; gap: 8px; align-items: stretch; }
  .linha .grande { flex: 1; }
  /* missão */
  #progresso { height: 10px; background: #f5f5f4; border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
  #progresso i { display: block; height: 100%; background: var(--mel2); transition: width .3s; }
  .figura { display: block; margin: 0 auto; width: 170px; height: 150px; object-fit: contain; background: #fff; border-radius: 16px; }
  .enunciado { text-align: center; font-size: 16px; color: var(--cinza); margin: 8px 0 6px; font-weight: 600; }
  .ouvir { margin: 6px auto 4px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ouvir button { background: var(--tinta); color: #fff; border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 16px; }
  .ouvir button.claro { background: #f5f5f4; color: var(--tinta); }
  .palavra { display: flex; justify-content: center; gap: 5px; margin: 14px 0; min-height: 52px; }
  .palavra.longa { gap: 3px; } .palavra.longa .casa { font-size: 23px; }
  .casa { flex: 0 1 38px; min-width: 0; height: 50px; border-bottom: 4px solid var(--tinta); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; text-transform: lowercase; }
  .casa.vazia { border-color: var(--mel2); background: #fef9c3; border-radius: 8px 8px 0 0; }
  .casa.ok { color: var(--verde); } .casa.erro { color: var(--vermelho); }
  .casa.mini { flex-basis: 26px; height: 38px; font-size: 22px; }
  .pecas { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .peca { width: 52px; height: 56px; border-radius: 14px; background: var(--mel); box-shadow: 0 4px 0 var(--mel2); font-size: 30px; font-weight: 800; text-transform: lowercase; }
  .peca:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mel2); }
  .peca.usada { visibility: hidden; }
  .peca.nao { animation: treme .35s; background: #e7e5e4; box-shadow: 0 4px 0 #d6d3d1; color: #a8a29e; }
  .opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .opcao { background: #fff; border: 3px solid var(--borda); border-radius: 16px; padding: 14px 6px; font-size: 30px; font-weight: 800; box-shadow: 0 4px 0 var(--borda); }
  .opcao small { display: block; font-size: 14px; color: var(--cinza); font-weight: 600; margin-top: 2px; }
  .opcao.nao { animation: treme .35s; opacity: .35; }
  .opcao.sim { border-color: var(--verde); background: #dcfce7; }
  .opcao.texto { font-size: 24px; }
  @keyframes treme { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #teclado { margin-top: 10px; user-select: none; -webkit-user-select: none; }
  #teclado .fila { display: flex; justify-content: center; gap: 5px; margin-bottom: 6px; }
  #teclado button { flex: 1; max-width: 44px; height: 50px; border-radius: 10px; background: #fff; border: 2px solid var(--borda); box-shadow: 0 3px 0 var(--borda); font-size: 21px; font-weight: 800; }
  #teclado button:active { background: var(--mel); }
  #teclado button.larga { max-width: 76px; flex: 1.7; font-size: 18px; }
  .acao { width: 100%; margin-top: 12px; background: var(--tinta); color: #fff; border-radius: 16px; padding: 15px; font-size: 19px; font-weight: 800; box-shadow: 0 4px 0 #000; }
  .acao.mel { background: var(--mel); color: var(--tinta); box-shadow: 0 4px 0 var(--mel2); }
  .acao.verde { background: var(--verde); box-shadow: 0 4px 0 #14532d; }
  .acao.vermelho { background: #fff; color: var(--vermelho); border: 3px solid var(--vermelho); box-shadow: none; }
  .acao:disabled { opacity: .4; }
  .duas { display: flex; gap: 10px; } .duas .acao { flex: 1; }
  .feedback { text-align: center; font-size: 20px; font-weight: 800; margin-top: 10px; min-height: 28px; }
  .feedback.ok { color: var(--verde); } .feedback.erro { color: var(--vermelho); }
  .letrona { text-align: center; font-size: 96px; font-weight: 900; line-height: 1; margin: 10px 0 2px; }
  .dica-pt { text-align: center; color: var(--cinza); font-size: 15px; }
  /* favo */
  .favo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .alveolo { background: #fff; border: 2px solid var(--borda); border-radius: 14px; padding: 6px 4px 8px; text-align: center; }
  .alveolo img { width: 100%; height: 72px; object-fit: contain; }
  .alveolo b { display: block; font-size: 16px; margin-top: 2px; }
  .alveolo .est { font-size: 13px; letter-spacing: 1px; }
  .alveolo.m3 { border-color: var(--mel2); background: #fef9c3; }
  .abc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .abc button { background: #fff; border: 2px solid var(--borda); border-radius: 14px; padding: 8px 2px; font-size: 26px; font-weight: 900; }
  .abc button small { display: block; font-size: 13px; font-weight: 600; color: var(--cinza); }
  .abc button.firme { border-color: var(--mel2); background: #fef9c3; }
  /* fim */
  .fim { text-align: center; padding: 16px 0; }
  .fim .grandao { font-size: 74px; }
  .fim h2 { font-size: 26px; margin: 6px 0; }
  .fim p { color: var(--cinza); font-size: 17px; }
  /* painel */
  .painel h2 { font-size: 18px; margin: 4px 0 8px; }
  .painel table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .painel td, .painel th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--borda); }
  .painel textarea { width: 100%; height: 90px; font-size: 12px; font-family: Consolas, monospace; border: 1px solid var(--borda); border-radius: 8px; padding: 6px; }
  .painel label { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--borda); }
  .painel select, .painel input[type=checkbox] { font-size: 16px; transform: scale(1.2); }
  .pequeno { font-size: 13px; color: var(--cinza); line-height: 1.4; }
  #aviso { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); background: var(--tinta); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; transition: transform .25s; z-index: 9; max-width: 90vw; text-align: center; }
  #aviso.ver { transform: translate(-50%, 0); }
  #abertura { text-align: center; padding-top: 30px; }
  #abertura .bee { font-size: 110px; }
  #abertura h2 { font-size: 28px; margin: 10px 0 6px; }
  #abertura p { color: var(--cinza); line-height: 1.5; }
  @media (max-width: 370px) { .casa { font-size: 25px; } .peca { width: 44px; } #teclado button { height: 46px; font-size: 18px; } }
</style>
</head>
<body>
<header id="topo">
  <div id="logo" title="segure 3 segundos: painel do papai">🐝</div>
  <h1>Spelling Bee<small>do Benjamin · final do 3º ano</small></h1>
  <button class="chip" id="chave-voz" aria-pressed="true">🔊</button>
  <button class="chip" id="botao-casa">🏠</button>
</header>
<main id="palco"></main>
<div id="aviso"></div>

<script id="logica">
// Lógica pura do Spelling Bee — só funções que devolvem dados (testadas pelo tests.html, D-JC-1).
const Logica = (() => {
  // As 100 palavras da lista da escola (PDF "100 PALAVRAS (SPELLING BEE 3º ANO)"), na ordem do PDF e dos cards.
  const NIVEIS = [
    { id: 1, nome: 'Fáceis', icone: '🌼', palavras: 'book glue pencil marker hot cold rainy windy sunny cloudy hat coat pants boots ball bike girl boy tired hungry angry reading writing talking laughing lion hippo panda tiger zebra cook doctor'.split(' ') },
    { id: 2, nome: 'Médias', icone: '🌻', palavras: 'scissors crayons snowy jacket sweater gloves shorts jeans raincoat soccer listening erasing coloring gluing counting smiling crying yawning thirsty scared silly bored between behind above stairs shower stove sink parent camel monkey parrot penguin elephant teeth trunk'.split(' ') },
    { id: 3, nome: 'Difíceis', icone: '🌺', palavras: 'paintbrush umbrella bathing fireplace armchair bookcase microwave refrigerator staircase frowning surprised shelves worried excited student child person playground skateboard throw catch bounce front under next crocodile giraffe kangaroo climb colorful scientist'.split(' ') },
  ];
  const PALAVRAS = NIVEIS.flatMap(n => n.palavras.map(w => ({ w, nivel: n.id })));
  const NIVEL_DE = Object.fromEntries(PALAVRAS.map(p => [p.w, p.nivel]));
  const LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  // Como se fala o NOME da letra em inglês, escrito pro ouvido de quem fala português.
  const DICA_PT = { A: 'êi', B: 'bí', C: 'sí', D: 'dí', E: 'í', F: 'éf', G: 'djí', H: 'êitch', I: 'ái', J: 'djêi', K: 'kêi', L: 'él', M: 'ém', N: 'én', O: 'ôu', P: 'pí', Q: 'kiú', R: 'ár', S: 'és', T: 'tí', U: 'iú', V: 'ví', W: 'dâbliu', X: 'éks', Y: 'uái', Z: 'zí' };
  // Letras que quem fala português confunde no ouvido (o nome em inglês soa como OUTRA letra em português).
  const PRIMAS = [['A', 'E', 'I'], ['E', 'I', 'Y'], ['G', 'J'], ['B', 'V', 'D', 'P'], ['K', 'Q', 'C'], ['Y', 'W', 'U'], ['M', 'N'], ['S', 'C', 'Z', 'X'], ['O', 'U'], ['H', 'A', 'K'], ['R', 'A'], ['T', 'D'], ['F', 'S']];
  const VOGAIS = new Set('aeiou'.split(''));
  const PARES_DIFICEIS = ['ph', 'ck', 'gh', 'wr', 'kn', 'sh', 'ch', 'th', 'wh', 'ea', 'ee', 'oo', 'ou', 'ow', 'ai', 'ay', 'ie', 'ey', 'oa', 'aw', 'ir', 'er', 'ur', 'or', 'ar', 'le', 'ss', 'tt', 'pp', 'rr', 'll', 'ff', 'cc'];

  function criarRng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function embaralhar(rng, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function diaDe(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }

  function primas(letra) { const s = new Set(); PRIMAS.forEach(g => { if (g.includes(letra)) g.forEach(x => x !== letra && s.add(x)); }); return [...s]; }
  // 4 opções: a certa + primas (as que confundem) primeiro + sorteadas; todas distintas.
  function opcoesLetra(rng, letra, n = 4) {
    letra = letra.toUpperCase();
    const out = [letra];
    for (const p of embaralhar(rng, primas(letra))) if (out.length < n && !out.includes(p)) out.push(p);
    for (const p of embaralhar(rng, LETRAS)) if (out.length < n && !out.includes(p)) out.push(p);
    return embaralhar(rng, out);
  }

  // Onde mora a pegadinha: letra dobrada, dupla difícil (ph, ck, ea…), vogal, e final mudo.
  function pesoPosicao(w, i) {
    const c = w[i]; let p = 0;
    if (VOGAIS.has(c)) p += 2;
    if (w[i - 1] === c || w[i + 1] === c) p += 3;
    if (PARES_DIFICEIS.includes(w.slice(i, i + 2)) || PARES_DIFICEIS.includes(w.slice(i - 1, i + 1))) p += 2;
    if (i === w.length - 1 && c === 'e') p += 3;
    if (c === 'y') p += 2;
    if (i === 0) p -= 3; // a primeira letra fica: é a âncora pra lembrar a palavra
    return p;
  }
  function quantosBuracos(w) { return w.length <= 4 ? 1 : w.length <= 7 ? 2 : 3; }
  function buracos(rng, w) {
    const pos = w.split('').map((_, i) => ({ i, p: pesoPosicao(w, i) + rng() * 0.9 }));
    pos.sort((a, b) => b.p - a.p);
    return pos.slice(0, quantosBuracos(w)).map(x => x.i).sort((a, b) => a - b);
  }
  function pecasMonta(rng, w) {
    const letras = w.split('');
    let p = embaralhar(rng, letras), tent = 0;
    while (w.length > 1 && p.join('') === w && tent++ < 20) p = embaralhar(rng, letras);
    return p;
  }
  function verificar(w, resposta) { return String(resposta || '').trim().toLowerCase() === w; }
  // Compara letra a letra o que ele digitou com a palavra (pra mostrar onde escorregou).
  function comparar(w, resposta) {
    const r = String(resposta || '').toLowerCase(), n = Math.max(w.length, r.length), out = [];
    for (let i = 0; i < n; i++) out.push({ certa: w[i] || '', dele: r[i] || '', ok: w[i] === r[i] });
    return out;
  }

  // ---------- estado salvo (chave fixa, completamento — D-JC-3) ----------
  function estadoInicial() { return completarEstado({}); }
  function completarEstado(e) {
    e = (e && typeof e === 'object') ? e : {};
    e.v = 1;
    e.palavras = (e.palavras && typeof e.palavras === 'object') ? e.palavras : {};
    e.letras = (e.letras && typeof e.letras === 'object') ? e.letras : {};
    e.dias = Array.isArray(e.dias) ? e.dias.filter(d => typeof d === 'string') : [];
    e.feitosDia = (e.feitosDia && typeof e.feitosDia === 'object') ? e.feitosDia : {};
    e.prefs = Object.assign({ voz: true, falarTeclas: true, tamMissao: 10, velocidade: 0.8 }, (e.prefs && typeof e.prefs === 'object') ? e.prefs : {});
    e.boasVindas = !!e.boasVindas;
    if (e.atual && (typeof e.atual !== 'object' || !Array.isArray(e.atual.fila))) e.atual = null;
    e.atual = e.atual || null;
    for (const w of Object.keys(e.palavras)) e.palavras[w] = Object.assign({ m: 0, ac: 0, er: 0 }, e.palavras[w]);
    for (const l of Object.keys(e.letras)) e.letras[l] = Object.assign({ m: 0, ac: 0, er: 0 }, e.letras[l]);
    return e;
  }
  function validarImportacao(txt) { try { const o = JSON.parse(txt); return (o && typeof o === 'object' && !Array.isArray(o)) ? completarEstado(o) : null; } catch (err) { return null; } }
  function dominio(e, w) { return e.palavras[w] || { m: 0, ac: 0, er: 0 }; }
  // m = domínio 0..3 (3 = firme). Só a 1ª tentativa de cada pergunta conta; acertou +1, errou −1.
  function registrar(mapa, chave, certo, dia) {
    const d = Object.assign({ m: 0, ac: 0, er: 0 }, mapa[chave] || {});
    if (certo) { d.ac++; d.m = Math.min(3, d.m + 1); } else { d.er++; d.m = Math.max(0, d.m - 1); d.ultimoErro = dia || null; }
    mapa[chave] = d; return d;
  }
  function registrarPalavra(e, w, certo, dia) { return registrar(e.palavras, w, certo, dia); }
  function registrarLetra(e, l, certo, dia) { return registrar(e.letras, l, certo, dia); }
  function marcarDia(e, dia) { if (!e.dias.includes(dia)) e.dias.push(dia); e.dias.sort(); return e; }
  function diaDoPlano(e, dia) { const i = e.dias.indexOf(dia); return i < 0 ? e.dias.length + 1 : i + 1; }
  // O plano dos 3 dias: dia 1 fáceis, dia 2 médias + erros, dia 3 difíceis + simulação. Depois: só palco.
  function planoDoDia(n) {
    if (n <= 1) return { titulo: 'Dia 1 de 3', texto: 'Hoje: as letras e as 32 palavras fáceis.', passos: ['abc', 'nivel1', 'nivel1'] };
    if (n === 2) return { titulo: 'Dia 2 de 3', texto: 'Hoje: as 37 palavras médias e as que escaparam ontem.', passos: ['abc', 'nivel2', 'nivel2', 'erros'] };
    if (n === 3) return { titulo: 'Dia 3 de 3', texto: 'Hoje: as 31 difíceis e um ensaio da final.', passos: ['nivel3', 'nivel3', 'erros', 'palco'] };
    return { titulo: 'Dia da final!', texto: 'Ensaio no palco com as 100 palavras. Você consegue!', passos: ['abc', 'erros', 'palco'] };
  }
  function progressoNivel(e, nivel) {
    const ws = NIVEIS[nivel - 1].palavras;
    const ms = ws.map(w => dominio(e, w).m);
    return { total: ws.length, firmes: ms.filter(m => m >= 3).length, vistas: ws.filter(w => e.palavras[w]).length, pontos: ms.reduce((a, b) => a + b, 0), max: ws.length * 3 };
  }
  function erradas(e) {
    return Object.entries(e.palavras).filter(([w, d]) => d.er > 0 && d.m < 3 && NIVEL_DE[w]).sort((a, b) => (a[1].m - b[1].m) || (b[1].er - a[1].er)).map(([w]) => w);
  }

  // Escolhe as palavras: as menos dominadas primeiro (erradas na frente), com sorteio entre iguais.
  function priorizar(rng, e, ws) {
    return ws.map(w => { const d = dominio(e, w); return { w, k: d.m * 10 - Math.min(d.er, 5) * 2 - (e.palavras[w] ? 0 : 1) + rng() * 3 }; }).sort((a, b) => a.k - b.k).map(x => x.w);
  }
  function atividadePara(m) { return m <= 0 ? 'monta' : m === 1 ? 'falta' : 'digita'; }
  function criarItemPalavra(rng, e, w, forcar) {
    const atividade = forcar || atividadePara(dominio(e, w).m);
    const it = { tipo: 'palavra', w, atividade, tent: 0 };
    if (atividade === 'monta') it.pecas = pecasMonta(rng, w);
    if (atividade === 'falta') { it.buracos = buracos(rng, w); it.opcoes = it.buracos.map(i => opcoesLetra(rng, w[i])); }
    return it;
  }
  function criarMissao(rng, e, alvo, n) {
    n = n || e.prefs.tamMissao || 10;
    let ws, rotulo, tipo = 'palavras';
    if (alvo === 'erros') { ws = erradas(e).slice(0, n); rotulo = 'Revisar as que escaparam'; if (!ws.length) ws = priorizar(rng, e, PALAVRAS.map(p => p.w)).slice(0, n); }
    else if (alvo === 'palco') {
      tipo = 'palco'; rotulo = 'Palco — ensaio da final';
      ws = embaralhar(rng, priorizar(rng, e, PALAVRAS.map(p => p.w)).slice(0, n));
    } else {

    const pintar = () => {
      $('#digitado').className = classePalavra(txt.length + 1);
      $('#digitado').innerHTML = txt.split('').map(c => `<div class="casa">${esc(c)}</div>`).join('') + (txt.length < 16 ? '<div class="casa vazia"></div>' : '');
      const p = $('#pronto'); if (p) p.disabled = !txt.length;
    };
    teclas = {
      letra: c => { if (txt.length >= 16) return; txt += c.toLowerCase(); if (estado.prefs.falarTeclas) falarLetra(c); pintar(); },
      apagar: () => { txt = txt.slice(0, -1); pintar(); },
      ok: () => { if (txt) conferir(); },
    };
    ligarTeclado();
    const conferir = () => {
      teclas = null;
      if (L.verificar(w, txt)) { $('#digitado').innerHTML = w.split('').map(c => `<div class="casa ok">${esc(c)}</div>`).join(''); $('#teclado').remove(); return celebrar(w, it.tent === 0); }
      const cmp = L.comparar(w, txt);
      $('#teclado').remove();
      $('#digitado').outerHTML = `<div class="enunciado">Você escreveu:</div><div class="${classePalavra(cmp.length)}">${cmp.map(x => `<div class="casa mini ${x.ok ? 'ok' : 'erro'}">${esc(x.dele)}</div>`).join('')}</div>
        <div class="enunciado">O certo é:</div><div class="${classePalavra(cmp.length)}">${cmp.map(x => `<div class="casa mini ${x.ok ? '' : 'ok'}">${esc(x.certa)}</div>`).join('')}</div>`;
      $('#feedback').className = 'feedback erro'; $('#feedback').textContent = 'Quase! Ela volta daqui a pouco.';
      $('#acoes').innerHTML = `<button class="acao mel" id="proxima">Entendi ➜</button>`;
      $('#proxima').onclick = () => { calar(); concluir(false); };
      falarSoletrado(w);
    };
    pintar();
    falarPalavra(w);
  }
  function tecladoHTML() {
    const filas = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
    return `<div id="teclado">${filas.map((f, i) => `<div class="fila">${f.split('').map(c => `<button data-k="${c}">${c}</button>`).join('')}${i === 2 ? '<button class="larga" data-k="⌫">⌫</button>' : ''}</div>`).join('')}</div>`;
  }
  function ligarTeclado() {
    const t = $('#teclado'); if (!t) return;
    t.querySelectorAll('button').forEach(b => b.onclick = () => { if (!teclas) return; b.dataset.k === '⌫' ? teclas.apagar() : teclas.letra(b.dataset.k); });
    const p = $('#pronto'); if (p) p.onclick = () => teclas && teclas.ok();
  }
  document.addEventListener('keydown', ev => {
    if (!teclas) return;
    if (/^[a-z]$/i.test(ev.key) && teclas.letra) { teclas.letra(ev.key.toUpperCase()); ev.preventDefault(); }
    else if (ev.key === 'Backspace' && teclas.apagar) { teclas.apagar(); ev.preventDefault(); }
    else if (ev.key === 'Enter' && teclas.ok) { teclas.ok(); ev.preventDefault(); }
  });

  // Palco: como na final — ouve a palavra, soletra EM VOZ ALTA, depois confere letra por letra.
  function telaPalco(m, it) {
    const w = it.w;
    palco.innerHTML = `${cabecalho(m)}${figuraHTML(w)}<div class="ouvir"><button id="b-ouvir">🔊 Ouvir</button><button class="claro" id="b-devagar">🐢 Devagar</button></div>
      <div class="enunciado">Diga a palavra, soletre em voz alta,<br>e diga a palavra de novo.</div>
      <div class="palavra" id="revela"></div>
      <div class="feedback" id="feedback"></div>
      <div id="acoes"><button class="acao mel" id="ver">Conferir 👀</button></div>`;
    $('#b-ouvir').onclick = () => falar('Your word is: ' + w + '. ' + w + '.');
    $('#b-devagar').onclick = () => falar(w + '.', null, 0.5);
    $('#ver').onclick = () => {
      $('#acoes').innerHTML = '';
      const casas = w.split('');
      let i = 0;
      $('#revela').className = classePalavra(casas.length);
      $('#revela').innerHTML = casas.map(() => '<div class="casa"></div>').join('');
      const passo = () => {
        if (rotaAtual() !== 'missao' || estado.atual !== m) return;
        if (i < casas.length) {
          $('#revela').children[i].textContent = casas[i];
          falar(casas[i].toUpperCase() + '.', () => { i++; setTimeout(passo, 120); }, 0.9);
          return;
        }
        falar(w + '.');
        $('#feedback').className = 'feedback'; $('#feedback').textContent = 'Você acertou todas as letras?';
        $('#acoes').innerHTML = `<div class="duas"><button class="acao verde" id="sim">✅ Acertei</button><button class="acao vermelho" id="nao">Errei</button></div>`;
        $('#sim').onclick = () => { calar(); plim(); concluir(true); };
        $('#nao').onclick = () => { calar(); concluir(false); };
      };
      if (estado.prefs.voz && temVoz) passo();
      else { casas.forEach((c, j) => $('#revela').children[j].textContent = c); i = casas.length; passo(); }
    };
    falar('Your word is: ' + w + '. ' + w + '.');
  }

  // ---------- letras ----------
  function telaOuvir(m, it) {
    let errou = false;
    palco.innerHTML = `${cabecalho(m)}<div class="enunciado">Ouça o nome da letra e toque nela</div>
      <div class="ouvir"><button id="b-ouvir" style="font-size:22px;padding:16px 26px">🔊 Ouvir a letra</button></div>
      <div class="opcoes">${it.opcoes.map(o => `<button class="opcao" data-o="${o}">${o}${o.toLowerCase()}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div><div id="acoes"></div>`;
    $('#b-ouvir').onclick = () => falarLetra(it.l);
    palco.querySelectorAll('.opcao').forEach(b => b.onclick = () => {
      if (b.dataset.o === it.l) {
        b.classList.add('sim'); palco.querySelectorAll('.opcao').forEach(x => x.disabled = true);
        $('#feedback').className = 'feedback ok'; $('#feedback').textContent = (errou ? 'Isso: ' : 'Isso! ') + it.l + ' se fala “' + L.DICA_PT[it.l] + '”';
        if (!errou) plim();
        $('#acoes').innerHTML = `<button class="acao mel" id="proxima">Próxima ➜</button>`;
        $('#proxima').onclick = () => { calar(); concluir(!errou); };
        falarLetra(it.l);
      } else { errou = true; b.classList.add('nao'); b.disabled = true; falarLetra(it.l); }
    });
    falarLetra(it.l);
  }
  function telaNome(m, it) {
    let errou = false;
    const ops = it.opcoes;
    palco.innerHTML = `${cabecalho(m)}<div class="enunciado">Como se fala esta letra em inglês?</div>
      <div class="letrona">${it.l}${it.l.toLowerCase()}</div>
      <div class="opcoes">${ops.map(o => `<button class="opcao texto" data-o="${o}">“${L.DICA_PT[o]}”</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div><div id="acoes"></div>`;
    palco.querySelectorAll('.opcao').forEach(b => b.onclick = () => {
      falarLetra(b.dataset.o);
      if (b.dataset.o === it.l) {
        b.classList.add('sim'); palco.querySelectorAll('.opcao').forEach(x => x.disabled = true);
        $('#feedback').className = 'feedback ok'; $('#feedback').textContent = errou ? 'Isso! Agora você lembra 👍' : 'Isso! 🎉';
        if (!errou) plim();
        $('#acoes').innerHTML = `<button class="acao mel" id="proxima">Próxima ➜</button>`;
        $('#proxima').onclick = () => { calar(); concluir(!errou); };
      } else { errou = true; b.classList.add('nao'); b.disabled = true; }
    });
  }
  function telaSequencia(m, it) {
    const alvo = it.w.toUpperCase().split('');
    let pos = 0, errou = false;
    const desenhar = () => {
      palco.innerHTML = `${cabecalho(m)}<div class="enunciado">Ouça as letras e toque na ordem</div>
        <div class="ouvir"><button id="b-ouvir">🔊 Ouvir as letras</button><button class="claro" id="b-devagar">🐢 Devagar</button></div>
        ${palavraCasas(it.w, i => i < pos, i => i === pos ? 'vazia' : '')}
        <div class="pecas">${it.opcoes.map(o => `<button class="peca" data-o="${o}">${o.toLowerCase()}</button>`).join('')}</div>
        <div class="feedback" id="feedback"></div><div id="acoes"></div>`;
      $('#b-ouvir').onclick = () => falar(falaLetras(it.w));
      $('#b-devagar').onclick = () => falar(falaLetras(it.w), null, 0.5);
      palco.querySelectorAll('.peca').forEach(b => b.onclick = () => {
        if (pos >= alvo.length) return;
        if (b.dataset.o === alvo[pos]) {
          pos++; falarLetra(b.dataset.o); desenhar();
          if (pos === alvo.length) {
            palco.querySelectorAll('.peca').forEach(x => x.disabled = true);
            const f = document.createElement('div'); f.innerHTML = figuraHTML(it.w); palco.insertBefore(f.firstChild, $('#feedback'));
            $('#feedback').className = 'feedback ok'; $('#feedback').textContent = 'É “' + it.w + '”! ' + (errou ? '👍' : '🎉');
            if (!errou) plim();
            $('#acoes').innerHTML = `<button class="acao mel" id="proxima">Próxima ➜</button>`;
            $('#proxima').onclick = () => { calar(); concluir(!errou); };
            falar(it.w + '!');
          }
        } else { errou = true; b.classList.remove('nao'); void b.offsetWidth; b.classList.add('nao'); falarLetra(b.dataset.o); }
      });
    };
    desenhar();
    falar(falaLetras(it.w));
  }

  // ---------- estudar: o favo (todas as palavras do nível) e o alfabeto ----------
  function telaFavo(nv) {
    const N = L.NIVEIS[nv - 1];
    palco.innerHTML = `<div class="enunciado" style="text-align:left">${N.icone} Palavras ${N.nome.toLowerCase()} — toque para ouvir soletrada</div>
      <div class="favo">${N.palavras.map(w => { const d = L.dominio(estado, w); return `<button class="alveolo m${d.m}" data-w="${w}"><img src="${img(w)}" alt="" loading="lazy"><b>${w}</b><div class="est">${'★'.repeat(d.m)}${'☆'.repeat(3 - d.m)}</div></button>`; }).join('')}</div>
      <button class="acao mel" id="treinar">Treinar estas ➜</button>`;
    palco.querySelectorAll('.alveolo').forEach(b => b.onclick = () => falarSoletrado(b.dataset.w));
    $('#treinar').onclick = () => iniciar('nivel' + nv);
  }
  function telaABC() {
    palco.innerHTML = `<div class="enunciado" style="text-align:left">O alfabeto em inglês — toque para ouvir</div>
      <div class="abc">${L.LETRAS.map(l => `<button class="${estado.letras[l] && estado.letras[l].m >= 3 ? 'firme' : ''}" data-l="${l}">${l}${l.toLowerCase()}<small>${L.DICA_PT[l]}</small></button>`).join('')}</div>
      <p class="pequeno" style="margin-top:10px">Cuidado com as primas: <b>A</b> “êi” · <b>E</b> “í” · <b>I</b> “ái” · <b>G</b> “djí” · <b>J</b> “djêi” · <b>H</b> “êitch” · <b>R</b> “ár” · <b>W</b> “dâbliu” · <b>Y</b> “uái”.</p>
      <button class="acao mel" id="treinar">Treinar as letras ➜</button>`;
    palco.querySelectorAll('.abc button').forEach(b => b.onclick = () => falarLetra(b.dataset.l));
    $('#treinar').onclick = () => iniciar('abc');
  }

  // ---------- painel do papai ----------
  function telaPainel() {
    const errs = Object.entries(estado.palavras).filter(([, d]) => d.er > 0).sort((a, b) => b[1].er - a[1].er || a[1].m - b[1].m);
    const lets = Object.entries(estado.letras).filter(([, d]) => d.er > 0).sort((a, b) => b[1].er - a[1].er);
    palco.innerHTML = `<div class="painel">
      <div class="cartao"><h2>👨 Painel do papai</h2>
        <p class="pequeno">Dias de treino: ${estado.dias.length ? estado.dias.join(', ') : 'nenhum ainda'}</p>
        ${L.NIVEIS.map(N => { const p = L.progressoNivel(estado, N.id); return `<p style="margin-top:6px">${N.icone} ${N.nome}: <b>${p.firmes}/${p.total}</b> firmes · ${p.vistas} vistas</p>`; }).join('')}
      </div>
      <div class="cartao"><h2>Palavras que ele mais erra</h2>
        ${errs.length ? `<table><tr><th>palavra</th><th>erros</th><th>acertos</th><th>domínio</th></tr>${errs.slice(0, 40).map(([w, d]) => `<tr><td><b>${w}</b></td><td>${d.er}</td><td>${d.ac}</td><td>${'★'.repeat(d.m)}${'☆'.repeat(3 - d.m)}</td></tr>`).join('')}</table>` : '<p class="pequeno">Nenhum erro registrado ainda.</p>'}
      </div>
      <div class="cartao"><h2>Letras que ele confunde</h2>
        ${lets.length ? lets.map(([l, d]) => `<b>${l}</b> (${d.er}×)`).join(' · ') : '<p class="pequeno">Nenhuma ainda.</p>'}
      </div>
      <div class="cartao"><h2>Ajustes</h2>
        <label>Palavras por missão <select id="tam">${[6, 8, 10, 12, 15].map(n => `<option ${n === estado.prefs.tamMissao ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label>Velocidade da voz <select id="vel">${[[0.6, 'devagar'], [0.8, 'normal'], [1, 'rápida']].map(([v, t]) => `<option value="${v}" ${v === estado.prefs.velocidade ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <label>Falar cada letra tocada <input type="checkbox" id="fteclas" ${estado.prefs.falarTeclas ? 'checked' : ''}></label>
        <button class="acao" id="teste-voz" style="margin-top:10px">🔊 Testar a voz (A, E, I, G, J)</button>
        <p class="pequeno" style="margin-top:6px">Voz em uso: ${vozEN ? esc(vozEN.name) : 'padrão do celular'}</p>
      </div>
      <div class="cartao"><h2>Guardar / levar o progresso</h2>
        <textarea id="json">${esc(JSON.stringify(estado))}</textarea>
        <div class="duas"><button class="acao" id="importar">Carregar este texto</button><button class="acao vermelho" id="zerar">Zerar tudo</button></div>
      </div>
      <button class="acao mel" id="sair">Sair do painel</button></div>`;
    $('#tam').onchange = e => { estado.prefs.tamMissao = Number(e.target.value); salvar(); };
    $('#vel').onchange = e => { estado.prefs.velocidade = Number(e.target.value); salvar(); };
    $('#fteclas').onchange = e => { estado.prefs.falarTeclas = e.target.checked; salvar(); };
    $('#teste-voz').onclick = () => falar('A. E. I. G. J. giraffe. G. I. R. A. F. F. E. giraffe.');
    $('#importar').onclick = () => { const n = L.validarImportacao($('#json').value); if (!n) return avisar('Texto inválido'); estado = n; salvar(); avisar('Progresso carregado'); render(); };
    $('#zerar').onclick = () => { if (!confirm('Zerar todo o progresso do Benjamin?')) return; estado = L.estadoInicial(); estado.boasVindas = true; salvar(); avisar('Zerado'); render(); };
    $('#sair').onclick = () => { painelLiberado = false; ir('inicio'); };
  }

  window.__jogo = { get estado() { return estado; } }; // pro robô de teste (D-JC-5)
  render();
})();
</script>
</body>
</html>
