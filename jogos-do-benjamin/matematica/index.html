<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matemática">
<title>Matemática do Benjamin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
  :root {
    --fundo: #eef3ff; --cartao: #fff; --texto: #111827; --suave: #4b5563; --borda: #c7d2fe;
    --azul: #1d4ed8; --verde: #15803d; --verde-claro: #dcfce7; --laranja: #c2410c; --laranja-claro: #ffedd5;
    --roxo: #6d28d9; --tema: #1d4ed8; --noite: #1e1b4b;
    --c0: #e5e7eb; --c1: #fde68a; --c2: #fcd34d; --c3: #86efac; --c4: #4ade80; --c5: #facc15;
    --nav: 68px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: var(--fundo); color: var(--texto);
    font-family: "Segoe UI", "Nunito", system-ui, -apple-system, Roboto, sans-serif;
    font-size: 20px; line-height: 1.35; user-select: none; -webkit-user-select: none; overflow-x: hidden;
    padding-bottom: calc(var(--nav) + env(safe-area-inset-bottom));
  }
  body.sem-abas { padding-bottom: env(safe-area-inset-bottom); }
  button, a.botao { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- topo ---------- */
  header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--noite); color: #fff;
  }
  #logo { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 20px; font-weight: 800; -webkit-touch-callout: none; white-space: nowrap; overflow: hidden; }
  #logo .icone { font-size: 26px; display: inline-block; transition: transform .3s; }
  #logo.segurando .icone { transform: scale(1.3) rotate(-15deg); }
  @media (max-width: 420px) { #logo .longo { display: none; } }
  .topo-btn { min-height: 46px; padding: 6px 14px; border-radius: 14px; border: 2px solid #a5b4fc; background: transparent; color: #fff; font-size: 18px; font-weight: 700; white-space: nowrap; }
  .topo-btn[aria-pressed="true"] { background: #4338ca; border-color: #fff; }

  /* ---------- abas de baixo ---------- */
  #abas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr);
    height: calc(var(--nav) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: #fff; border-top: 2px solid var(--borda); box-shadow: 0 -4px 16px rgba(30, 27, 75, .08);
  }
  #abas[hidden] { display: none; }
  #abas button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 26px; color: var(--suave); }
  #abas button span { font-size: 14px; font-weight: 700; }
  #abas button[aria-current="page"] { color: var(--azul); background: #eef2ff; }

  /* ---------- trilha do foguete ---------- */
  #trilha { padding: 8px 12px 0; max-width: 960px; margin: 0 auto; }
  .pista { position: relative; height: 44px; border-radius: 22px; background: linear-gradient(90deg, #312e81, #1e1b4b); overflow: hidden; border: 3px solid #312e81; }
  .pista .feito { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6366f1, #a855f7); transition: width .6s ease; }
  .pista .estrelinhas { position: absolute; inset: 0; background-image: radial-gradient(#fff 1px, transparent 1.5px); background-size: 22px 22px; opacity: .35; }
  .pista .foguete { position: absolute; top: 50%; font-size: 28px; transform: translate(-50%, -50%) rotate(45deg); transition: left .6s ease; }
  .pista .lua { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 28px; }
  .contador { text-align: center; font-size: 16px; color: var(--suave); margin-top: 2px; }

  /* ---------- palco ---------- */
  main { max-width: 960px; margin: 0 auto; padding: 10px 12px 24px; display: grid; gap: 14px; }
  .cartao { background: var(--cartao); border-radius: 22px; padding: 16px; border: 3px solid var(--borda); box-shadow: 0 5px 0 #c7d2fe, 0 10px 26px rgba(30, 27, 75, .10); }
  h2.secao { font-size: 22px; margin: 4px 4px -4px; }
  .selo { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--tema); color: #fff; font-weight: 700; font-size: 16px; }
  .linha-selo { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .botao-mini { min-height: 46px; min-width: 52px; padding: 4px 12px; border-radius: 14px; border: 2px solid var(--borda); background: #f5f7ff; font-size: 18px; }
  .enunciado { font-size: clamp(22px, 5.2vw, 27px); font-weight: 600; margin: 4px 0 10px; }
  .pergunta-etapa { font-size: clamp(20px, 4.6vw, 24px); font-weight: 700; color: var(--tema); margin-bottom: 8px; }
  .rom, .romano-grande, .decomp, .regra .ex, .simbolo .s { font-variant-numeric: lining-nums; }
  .rom { font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: 2px; color: var(--roxo); }
  .visual { display: flex; justify-content: center; margin: 4px 0 10px; }
  .romano-grande { font-family: Georgia, "Times New Roman", serif; font-size: clamp(52px, 14vw, 72px); font-weight: 700; letter-spacing: 6px; color: var(--roxo); }
  .expressao { font-size: clamp(44px, 12vw, 60px); font-weight: 800; text-align: center; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .expressao.texto { font-size: clamp(22px, 5.4vw, 28px); font-weight: 600; letter-spacing: 0; }
  .lacuna { display: inline-block; min-width: 1.3em; border-bottom: 5px solid var(--tema); color: var(--tema); }
  .corpo { display: grid; gap: 12px; }
  @media (min-width: 760px) and (orientation: landscape), (min-width: 1000px) {
    .corpo.duas { grid-template-columns: 1.1fr 1fr; align-items: start; }
  }

  /* ---------- entradas ---------- */
  .visor { min-height: 68px; border-radius: 18px; border: 4px solid var(--azul); background: #f8faff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 42px; font-weight: 800; letter-spacing: 3px; padding: 2px 12px; }
  .visor .vazio { color: #9ca3af; font-weight: 600; font-size: 30px; letter-spacing: 0; }
  .visor .sufixo { font-size: 22px; color: var(--suave); letter-spacing: 0; font-weight: 600; }
  .visor.rom-visor { font-family: Georgia, "Times New Roman", serif; color: var(--roxo); }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .teclado.pecas { grid-template-columns: repeat(var(--n, 4), 1fr); }
  .tecla { min-height: clamp(54px, 7.6vh, 68px); border-radius: 16px; border: 0; background: #e0e7ff; font-size: 30px; font-weight: 800; box-shadow: 0 4px 0 #a5b4fc; }
  .tecla:active, .opcao:active, .botao-grande:active { transform: translateY(3px); }
  .tecla.ok { background: var(--verde); color: #fff; box-shadow: 0 4px 0 #14532d; }
  .tecla.apagar { background: #fee2e2; box-shadow: 0 4px 0 #fca5a5; font-size: 24px; }
  .tecla.peca { font-family: Georgia, "Times New Roman", serif; color: var(--roxo); font-size: 36px; background: #ede9fe; box-shadow: 0 4px 0 #c4b5fd; }
  .linha-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .opcoes { display: grid; gap: 10px; }
  .opcoes.grade { grid-template-columns: 1fr 1fr; }
  .opcao { min-height: 64px; padding: 8px 14px; border-radius: 18px; border: 3px solid var(--borda); background: #f8faff; font-size: 26px; font-weight: 700; text-align: center; box-shadow: 0 4px 0 #c7d2fe; }
  .opcao.grande { font-size: 34px; font-weight: 800; }
  .opcao.rom { font-size: 32px; font-family: Georgia, "Times New Roman", serif; color: var(--roxo); }
  .opcao:not(.frase) { white-space: nowrap; }
  .opcao.frase { font-size: 21px; font-weight: 600; text-align: left; }
  .opcao.certa { background: var(--verde-claro); border-color: var(--verde); }
  .opcao.errada { background: var(--laranja-claro); border-color: var(--laranja); }
  .opcao:disabled { cursor: default; }
  .ligar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ligar .col { display: grid; gap: 8px; }
  .ligar .opcao { font-size: 22px; }
  .ligar .opcao.sel { border-color: var(--azul); background: #dbeafe; box-shadow: 0 0 0 4px #93c5fd; }
  .ligar .opcao.feito { background: var(--verde-claro); border-color: var(--verde); opacity: .75; }
  .dica-ligar { font-size: 17px; color: var(--suave); margin-bottom: 6px; }
  .aviso { color: var(--laranja); font-weight: 700; text-align: center; min-height: 24px; font-size: 18px; }

  /* ---------- conta armada ---------- */
  .etapas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .etapa { padding: 3px 12px; border-radius: 999px; background: #f1f5f9; color: var(--suave); font-size: 16px; font-weight: 700; border: 2px solid #e2e8f0; }
  .etapa.agora { background: var(--tema); color: #fff; border-color: var(--tema); }
  .etapa.ok { background: var(--verde-claro); color: var(--verde); border-color: var(--verde); }
  .conta { --cel: clamp(40px, 11.5vw, 54px); display: grid; justify-content: center; gap: 4px 5px; margin: 2px auto; font-variant-numeric: tabular-nums; }
  .conta .c { width: var(--cel); height: var(--cel); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cel) * .74); font-weight: 800; position: relative; }
  .conta .c.res { cursor: pointer; border: 3px solid #94a3b8; border-radius: 12px; background: #fff; }
  .conta .c.res.ativo { border-color: var(--azul); box-shadow: 0 0 0 4px #93c5fd; }
  .conta .c.res.certo { border-color: var(--verde); }
  .conta .c.vai { height: calc(var(--cel) * .7); font-size: calc(var(--cel) * .44); color: var(--laranja); }
  .conta .c.vai.caixa { cursor: pointer; border: 2px dashed #fdba74; border-radius: 10px; width: calc(var(--cel) * .8); margin: 0 auto; }
  .conta .c.vai.caixa.ativo { border-style: solid; border-color: var(--laranja); box-shadow: 0 0 0 3px #fed7aa; }
  .conta .c.riscado { color: #9ca3af; text-decoration: line-through; text-decoration-color: var(--laranja); }
  .conta .traco { grid-column: 1 / -1; height: 5px; background: var(--texto); border-radius: 3px; margin: 2px 0; }
  .ajuda-conta { font-size: 16px; color: var(--suave); text-align: center; }

  /* ---------- relógio e explicações ---------- */
  .relogio-wrap { display: grid; justify-items: center; gap: 6px; }
  .relogio { width: min(62vw, 240px); height: auto; }
  .legenda-relogio { display: grid; gap: 4px; font-size: 18px; }
  .lh { color: #dc2626; font-weight: 800; } .lm { color: #2563eb; font-weight: 800; }
  .pulsar { animation: pulsar 1.2s ease-in-out infinite; }
  @keyframes pulsar { 50% { opacity: .45; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 6px 0; }
  .chip { position: relative; padding: 6px 10px; border-radius: 12px; background: #f1f5f9; border: 2px solid #cbd5e1; font-weight: 700; font-size: 18px; }
  .chip.inicio { background: #dbeafe; border-color: var(--azul); } .chip.conta { background: #fef9c3; border-color: #ca8a04; }
  .chip.destino { background: var(--verde-claro); border-color: var(--verde); } .chip.marca { background: #ede9fe; border-color: var(--roxo); }
  .chip .num { position: absolute; top: -12px; right: -8px; background: #ca8a04; color: #fff; border-radius: 999px; font-size: 13px; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  .seta { color: var(--suave); font-weight: 700; font-size: 16px; }
  .tabela-uni { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 18px; max-width: 460px; margin: 6px auto; }
  .tabela-uni div { padding: 6px 10px; border-radius: 10px; background: #f8fafc; }
  .tabela-uni .hl { background: #fef9c3; font-weight: 800; }
  .decomp { font-family: Georgia, "Times New Roman", serif; font-size: clamp(22px, 6vw, 30px); text-align: center; font-weight: 700; color: var(--roxo); margin: 6px 0; }
  .dica { background: #fef9c3; border-radius: 14px; padding: 10px 14px; font-size: 20px; }
  .matriz { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 6px 0; font-size: 17px; color: var(--suave); }
  .matriz svg { max-width: 100%; height: auto; }

  /* ---------- camadas ---------- */
  #camada { position: fixed; inset: 0; display: none; z-index: 20; background: rgba(15, 23, 42, .45); align-items: flex-end; justify-content: center; }
  #camada.aberta { display: flex; }
  .folha { background: #fff; width: 100%; max-width: 760px; max-height: 92dvh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); border-top: 6px solid #f59e0b; animation: sobe .25s ease-out; }
  @keyframes sobe { from { transform: translateY(40px); opacity: 0; } }
  .folha h2 { font-size: 24px; margin-bottom: 4px; }
  .resposta-certa { font-size: 24px; margin: 2px 0 8px; } .resposta-certa b { color: var(--verde); }
  .explica { font-size: 19px; display: grid; gap: 6px; }
  .rodape-folha { font-size: 17px; color: var(--suave); margin-top: 8px; }
  .botao-grande { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 62px; margin-top: 12px; border: 0; border-radius: 18px; background: var(--azul); color: #fff; font-size: 23px; font-weight: 800; box-shadow: 0 5px 0 #1e3a8a; text-decoration: none; text-align: center; padding: 6px 12px; }
  .botao-grande.verde { background: var(--verde); box-shadow: 0 5px 0 #14532d; }
  .botao-grande.claro { background: #e0e7ff; color: var(--texto); box-shadow: 0 5px 0 #a5b4fc; }
  #festa { position: fixed; inset: 0; display: none; z-index: 30; align-items: center; justify-content: center; pointer-events: none; }
  #festa.aberta { display: flex; }
  .festa-caixa { background: #fff; border-radius: 26px; padding: 16px 30px; text-align: center; border: 5px solid #facc15; box-shadow: 0 16px 50px rgba(0,0,0,.25); animation: pop .4s cubic-bezier(.2, 1.6, .5, 1); }
  .festa-caixa .grande { font-size: 58px; } .festa-caixa .txt { font-size: 28px; font-weight: 800; color: var(--verde); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .brilho { position: fixed; font-size: 26px; animation: voa .9s ease-out forwards; pointer-events: none; z-index: 31; }
  @keyframes voa { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
  .tremer { animation: tremer .35s; }
  @keyframes tremer { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #aviso-flutuante { position: fixed; left: 50%; bottom: calc(var(--nav) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--noite); color: #fff; padding: 10px 18px; border-radius: 14px; font-size: 17px; z-index: 40; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; max-width: 90vw; }
  #aviso-flutuante.ver { opacity: 1; }

  /* ---------- páginas ---------- */
  .centro { text-align: center; display: grid; gap: 12px; justify-items: center; }
  .titulo { font-size: clamp(26px, 6.5vw, 32px); font-weight: 800; }
  .sub { font-size: 19px; color: var(--suave); }
  .pilha { display: grid; gap: 10px; width: 100%; max-width: 540px; }
  .mascote { font-size: 76px; animation: flutua 2.4s ease-in-out infinite; line-height: 1.1; }
  @keyframes flutua { 50% { transform: translateY(-8px); } }
  .perfil { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .perfil .insignia { font-size: 56px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #312e81, #1e1b4b); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #facc15; }
  .perfil .nome-pat { font-size: 24px; font-weight: 800; }
  .barra { height: 18px; border-radius: 999px; background: #e5e7eb; overflow: hidden; margin: 4px 0; }
  .barra i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #facc15); border-radius: 999px; }
  .placar { display: flex; flex-wrap: wrap; gap: 8px; }
  .placar span { background: #f5f7ff; border: 2px solid var(--borda); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 17px; }
  .missoes { display: grid; gap: 10px; }
  @media (min-width: 760px) { .missoes { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
  .missao { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; text-align: left; border-radius: 20px; border: 3px solid var(--borda); background: #fff; padding: 12px 14px; min-height: 92px; box-shadow: 0 4px 0 #c7d2fe; }
  .missao .planeta { font-size: 48px; grid-row: span 2; }
  .missao .nome { font-size: 21px; font-weight: 800; }
  .missao .estado { font-size: 17px; color: var(--suave); font-weight: 700; }
  .missao.feita { background: var(--verde-claro); border-color: #86efac; box-shadow: 0 4px 0 #86efac; }
  .missao.feita .estado { color: var(--verde); }
  .missao.proxima { border-color: var(--azul); box-shadow: 0 4px 0 #1d4ed8; }
  .missao.proxima .estado { color: var(--azul); }
  .degraus { display: grid; gap: 8px; }
  .degrau { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 16px; background: #f8fafc; border: 2px solid #e5e7eb; }
  .degrau .ic { font-size: 34px; text-align: center; }
  .degrau.ok { background: #fefce8; border-color: #fde047; }
  .degrau.atual { background: #eef2ff; border-color: var(--azul); box-shadow: 0 0 0 3px #c7d2fe; }
  .degrau.trancado { opacity: .55; filter: grayscale(.6); }
  .degrau b { font-size: 19px; } .degrau small { color: var(--suave); font-size: 15px; display: block; }
  .grafico { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 140px; margin-top: 6px; }
  .grafico div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 13px; color: var(--suave); gap: 3px; }
  .grafico i { display: block; width: 100%; max-width: 40px; background: linear-gradient(180deg, #a855f7, #6366f1); border-radius: 8px 8px 3px 3px; min-height: 3px; }
  .album-linha { display: grid; gap: 6px; padding: 10px 0; border-bottom: 2px dashed #e5e7eb; }
  .album-linha:last-child { border-bottom: 0; }
  .album-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: 19px; }
  .album-cab small { font-weight: 700; color: var(--suave); font-size: 15px; }
  .figurinhas { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  @media (max-width: 560px) { .figurinhas { grid-template-columns: repeat(5, 1fr); gap: 6px; } .fig { aspect-ratio: 1.25 / 1; font-size: 16px; } }
  .fig { aspect-ratio: 1 / 1.15; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(10px, 2.7vw, 15px); font-weight: 800; background: var(--c0); color: #6b7280; line-height: 1.1; }
  .fig small { font-size: .85em; }
  .fig.b1 { background: var(--c1); color: #78350f; } .fig.b2 { background: var(--c2); color: #78350f; }
  .fig.b3 { background: var(--c3); color: #14532d; } .fig.b4 { background: var(--c4); color: #14532d; }
  .fig.b5 { background: var(--c5); color: #713f12; box-shadow: 0 0 8px #f59e0b; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; color: var(--suave); }
  .legenda i { display: inline-block; width: 15px; height: 15px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
  .ganhos { display: grid; gap: 4px; width: 100%; max-width: 420px; font-size: 19px; text-align: left; }
  .ganhos div { display: flex; justify-content: space-between; padding: 6px 12px; border-radius: 12px; background: #f8fafc; }
  .ganhos .total { background: #fef9c3; font-weight: 800; }
  .subiu { background: var(--verde-claro); border: 2px solid #86efac; border-radius: 14px; padding: 6px 12px; font-size: 20px; font-weight: 800; }
  .regras { display: grid; gap: 10px; }
  .simbolos { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

<!-- ===================== LÓGICA DA REVISÃO (cópia exata de revisao-prova.html — os testes conferem) ===================== -->
<script id="logica">
const ROMAN_MAX = 50;

const Logica = (function () {
  'use strict';

  // ---------- aleatório (com semente opcional, para os testes) ----------
  function criarRng(semente) {
    let a = (semente >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const inteiro = (rng, min, max) => min + Math.floor(rng() * (max - min + 1));
  const escolher = (rng, lista) => lista[Math.floor(rng() * lista.length)];
  function embaralhar(rng, lista) {
    const c = lista.slice();
    for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
    return c;
  }
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  // ---------- numerais romanos ----------
  const TABELA_ROMANA = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  const VALOR = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };

  function paraRomano(n) {
    if (!Number.isInteger(n) || n < 1 || n > 3999) throw new RangeError('fora do intervalo: ' + n);
    let s = '';
    for (const [v, sim] of TABELA_ROMANA) while (n >= v) { s += sim; n -= v; }
    return s;
  }
  // valor "solto" (soma/subtrai sem checar regras); null se tiver letra estranha
  function valorSolto(s) {
    if (typeof s !== 'string' || !s) return null;
    s = s.toUpperCase();
    let total = 0;
    for (let i = 0; i < s.length; i++) {
      const v = VALOR[s[i]];
      if (!v) return null;
      const prox = VALOR[s[i + 1]] || 0;
      total += v < prox ? -v : v;
    }
    return total;
  }
  // válido = é exatamente a forma canônica do seu valor (pega IIII, VV, IL, XXXX, VIX...)
  function romanoValido(s) {
    const v = valorSolto(s);
    return v !== null && v >= 1 && v <= 3999 && paraRomano(v) === s.toUpperCase();
  }
  function deRomano(s) { return romanoValido(s) ? valorSolto(s) : null; }

  const SIMBOLOS = ['I', 'V', 'X', 'L', 'C', 'D', 'M'].filter(c => VALOR[c] <= Math.max(ROMAN_MAX, 1) ||
    Array.from({ length: ROMAN_MAX }, (_, i) => paraRomano(i + 1)).some(r => r.includes(c)));
  const COM_SUBTRACAO = [];
  for (let n = 1; n <= ROMAN_MAX; n++) if (/IV|IX|XL|XC|CD|CM/.test(paraRomano(n))) COM_SUBTRACAO.push(n);

  // peso extra nos números com subtração (4, 9, 14, 19, 24, 29, 40–49...)
  function sortearRomano(rng, min = 1, max = ROMAN_MAX) {
    const pool = COM_SUBTRACAO.filter(n => n >= min && n <= max);
    if (pool.length && rng() < 0.6) return escolher(rng, pool);
    return inteiro(rng, min, max);
  }

  function decomporRomano(n) {
    const partes = [];
    let r = n;
    for (const [v, s] of TABELA_ROMANA) while (r >= v) { partes.push({ simbolo: s, valor: v, subtrai: s.length === 2 }); r -= v; }
    return partes;
  }
  function textoDecomposicao(n) {
    const p = decomporRomano(n), rom = paraRomano(n);
    if (p.length === 1) return `${rom} = ${n}`;
    return `${rom} = ${p.map(x => x.simbolo).join(' + ')} = ${p.map(x => x.valor).join(' + ')} = ${n}`;
  }
  function linhasSubtracao(n) {
    return decomporRomano(n).filter(p => p.subtrai).map(p =>
      `${p.simbolo}: o ${p.simbolo[0]} vem ANTES do ${p.simbolo[1]}, então tira → ${VALOR[p.simbolo[1]]} − ${VALOR[p.simbolo[0]]} = ${p.valor}`);
  }
  function formaAditiva(n) { // sem subtração: 4 → IIII, 9 → VIIII, 40 → XXXX
    let s = '', r = n;
    for (const [v, sim] of [[1000, 'M'], [500, 'D'], [100, 'C'], [50, 'L'], [10, 'X'], [5, 'V'], [1, 'I']]) while (r >= v) { s += sim; r -= v; }
    return s;
  }
  function romanoTrocado(n) { // troca o 1º par de subtração: XIV → XVI
    const c = paraRomano(n);
    const t = c.replace(/IV|IX|XL|XC|CD|CM/, m => m[1] + m[0]);
    return t === c ? null : t;
  }
  function distratoresRomanos(n) {
    const certo = paraRomano(n), cands = [];
    const add = s => { if (s && s !== certo && !cands.includes(s) && deRomano(s) !== n) cands.push(s); };
    add(formaAditiva(n));
    if (n === 49) add('IL');
    if (n === 45) add('VL');
    if (n === 99) add('IC');
    if (n === 95) add('VC');
    if (n % 10 === 8) add(certo.replace(/VIII$/, 'IIX'));
    if (n % 10 === 0 && certo.endsWith('X')) add(certo.slice(0, -1) + 'VV');
    if (n % 10 === 5) add(certo.slice(0, -1) + 'IIIII');
    add(romanoTrocado(n));
    const inv = certo.split('').reverse().join('');
    if (!romanoValido(inv)) add(inv);
    for (const k of [n + 1, n - 1, n + 10, n - 10, n + 5, n + 2]) if (k >= 1 && k <= 3999) add(paraRomano(k));
    return cands.slice(0, 3);
  }
  // por que a escolha errada está errada (para a explicação)
  function porqueRomanoErrado(s, n) {
    const up = s.toUpperCase();
    if (/(I{4}|X{4}|C{4}|M{4})/.test(up)) return `${s} está errado: um símbolo pode repetir no máximo 3 vezes seguidas.`;
    if (/(VV|LL|DD)/.test(up)) return `${s} está errado: V, L e D nunca se repetem (VV seria X).`;
    if (/I[LCDM]|V[XLCDM]|X[DM]|L[CDM]/.test(up)) return `${s} está errado: só o I pode vir antes do V e do X, e só o X antes do L e do C.`;
    const v = deRomano(up);
    if (v !== null) return `${s} vale ${v}, não ${n}.`;
    return `${s} não é um jeito certo de escrever número romano.`;
  }

  // ---------- horas ----------
  const pad2 = n => String(n).padStart(2, '0');
  function formatarHora(h, m) { return m === 0 ? `${h}h` : `${h}h${pad2(m)}`; }
  function somarMinutos(h, m, minutos) {
    const total = ((h * 60 + m + minutos) % 1440 + 1440) % 1440;
    return { h: Math.floor(total / 60), m: total % 60 };
  }
  function para24h(h12) { return h12 === 12 ? 12 : h12 + 12; } // horas da tarde/noite
  function para12h(h24) { const h = h24 % 12; return h === 0 ? 12 : h; }
  function periodoDoDia(h24) { return h24 < 12 ? 'manhã' : h24 < 19 ? 'tarde' : 'noite'; }
  // linha do tempo pulando de 10 em 10 (o resto num pulo menor)
  function linhaDoTempo(h, m, minutos) {
    const pontos = [{ h, m, pulo: 0 }];
    let resta = minutos, atual = { h, m };
    while (resta > 0) {
      const pulo = Math.min(10, resta);
      atual = somarMinutos(atual.h, atual.m, pulo);
      pontos.push({ h: atual.h, m: atual.m, pulo });
      resta -= pulo;
    }
    return pontos;
  }
  function textoDuracao(min) { return min === 60 ? '1 hora' : `${min} minutos`; }
  function falaHora(h, m) { return m === 0 ? `${h} horas` : `${h} horas e ${m}`; }

  // ---------- calendário ----------
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  const ARTIGO_DIA = ['o', 'a', 'a', 'a', 'a', 'a', 'o'];
  const mod = (a, b) => ((a % b) + b) % b;
  function avancarMeses(i, k) { return mod(i + k, 12); }
  function avancarDias(i, k) { return mod(i + k, 7); }
  function diaComArtigo(i) { return `${ARTIGO_DIA[i]} ${DIAS[i]}`; }
  function deDia(i) { return (ARTIGO_DIA[i] === 'o' ? 'do ' : 'da ') + DIAS[i]; }
  function noDia(i) { return (ARTIGO_DIA[i] === 'o' ? 'no ' : 'na ') + DIAS[i]; }

  // ---------- multiplicação com reserva ----------
  function passosMultiplicacao(a, m) {
    const dig = String(a).split('').reverse().map(Number);
    const passos = [];
    let reserva = 0;
    dig.forEach((d, i) => {
      const produto = d * m, total = produto + reserva;
      passos.push({ coluna: i, digito: d, produto, reserva, total, escreve: total % 10, vai: Math.floor(total / 10) });
      reserva = Math.floor(total / 10);
    });
    const resultado = Number(String(reserva > 0 ? reserva : '') + passos.slice().reverse().map(p => p.escreve).join(''));
    return { passos, reservaFinal: reserva, resultado };
  }
  function temReserva(a, m) { return String(a).split('').some(d => Number(d) * m >= 10); }
  // erro típico: esquecer o "vai um" (só escreve o último algarismo de cada coluna)
  function semReserva(a, m) { return Number(String(a).split('').map(d => (Number(d) * m) % 10).join('')); }
  const NOMES_MULT = { 2: 'dobro', 3: 'triplo', 4: 'quádruplo (4 vezes)', 5: 'quíntuplo (5 vezes)' };
  const NOMES_COLUNA = ['unidades', 'dezenas', 'centenas', 'unidades de milhar', 'dezenas de milhar'];

  // ---------- unidades de tempo ----------
  const UNIDADES = [
    { nome: 'quinzena', art: 'uma', valor: 15, uni: 'dias' },
    { nome: 'bimestre', art: 'um', valor: 2, uni: 'meses' },
    { nome: 'trimestre', art: 'um', valor: 3, uni: 'meses' },
    { nome: 'semestre', art: 'um', valor: 6, uni: 'meses' },
    { nome: 'semana', art: 'uma', valor: 7, uni: 'dias' },
    { nome: 'ano', art: 'um', valor: 12, uni: 'meses' },
    { nome: 'dia', art: 'um', valor: 24, uni: 'horas' },
    { nome: 'hora', art: 'uma', valor: 60, uni: 'minutos' },
  ];

  // ---------- texto → fala ----------
  function paraFala(t) {
    return t
      .replace(/«([IVXLCDM]+)»/g, (_, r) => r.split('').join(' '))
      .replace(/\b(\d{1,2})h(\d{2})\b/g, '$1 horas e $2')
      .replace(/\b(\d{1,2})h\b/g, '$1 horas')
      .replace(/_{2,}/g, 'quantas')
      .replace(/×/g, ' vezes ')
      .replace(/[«»]/g, '');
  }

  // ======================================================================
  // GERADORES DE PERGUNTAS — cada um devolve um objeto só com dados (JSON)
  // ======================================================================
  const TEMAS = {
    romanos: { nome: 'Números romanos', icone: '🏛️', cor: '#6d28d9' },
    multiplicacao: { nome: 'Dobro e triplo', icone: '✖️', cor: '#be185d' },
    relogio: { nome: 'Relógio', icone: '🕐', cor: '#1d4ed8' },
    tempo: { nome: 'Quanto tempo passou', icone: '⏳', cor: '#0e7490' },
    calendario: { nome: 'Calendário', icone: '📅', cor: '#15803d' },
    unidades: { nome: 'Unidades de tempo', icone: '📏', cor: '#c2410c' },
  };
  const BASE = { romanos: 7, multiplicacao: 4, relogio: 5, tempo: 4, calendario: 6, unidades: 4 };

  function q(base) {
    const o = Object.assign({ visual: null, explicacao: { linhas: [], visual: null } }, base);
    if (!o.fala) o.fala = paraFala(o.enunciado);
    return o;
  }

  // ----- romanos -----
  function romR2N(rng) {
    const n = sortearRomano(rng), r = paraRomano(n);
    return q({ tema: 'romanos', tipo: 'numero', sub: 'r2n', meta: { n },
      enunciado: 'Quanto vale este número romano?', fala: `Quanto vale este número romano? ${r.split('').join(' ')}`,
      visual: { kind: 'romano', texto: r }, correta: String(n), respostaTexto: `${r} = ${n}`,
      explicacao: { linhas: [textoDecomposicao(n), ...linhasSubtracao(n)], visual: null } });
  }
  function romN2R(rng) {
    const n = sortearRomano(rng), r = paraRomano(n);
    return q({ tema: 'romanos', tipo: 'romano', sub: 'n2r', meta: { n },
      enunciado: `Monte o número ${n} em romanos:`, correta: r, respostaTexto: `${n} = ${r}`,
      explicacao: { linhas: [textoDecomposicao(n), ...linhasSubtracao(n)], visual: null } });
  }
  function romCerto(rng) {
    const n = sortearRomano(rng, 4), r = paraRomano(n);
    const opcoes = embaralhar(rng, [r, ...distratoresRomanos(n)]);
    return q({ tema: 'romanos', tipo: 'escolha', sub: 'certo', meta: { n }, opcoesRomanas: true,
      enunciado: `Qual destes é o jeito CERTO de escrever ${n} em romanos?`, opcoes, correta: r, respostaTexto: `${n} = ${r}`,
      explicacao: { linhas: [textoDecomposicao(n), ...linhasSubtracao(n)], visual: null } });
  }
  function romComparar(rng) {
    const n = sortearRomano(rng, 4);
    let k;
    const t = romanoTrocado(n), vt = t ? deRomano(t) : null;
    if (vt && vt <= ROMAN_MAX && rng() < 0.6) k = vt;
    else do { k = sortearRomano(rng); } while (k === n);
    const a = paraRomano(n), b = paraRomano(k), maior = n > k ? a : b;
    return q({ tema: 'romanos', tipo: 'escolha', sub: 'comparar', meta: { n, k }, opcoesRomanas: true,
      enunciado: 'Qual número romano é o MAIOR?', fala: `Qual número romano é o maior? ${a.split('').join(' ')} ou ${b.split('').join(' ')}?`,
      opcoes: embaralhar(rng, [a, b]), correta: maior, respostaTexto: `${maior} (${a} = ${n}, ${b} = ${k})`,
      explicacao: { linhas: [textoDecomposicao(n), textoDecomposicao(k), `Então ${maior} = ${Math.max(n, k)} é o maior.`], visual: null } });
  }
  const SECULOS = [
    [21, 'Nós vivemos no século «XXI».'],
    [20, 'Os avós do Benjamin nasceram no século «XX».'],
    [19, 'A Independência do Brasil aconteceu no século «XIX».'],
    [16, 'A cidade do Rio de Janeiro foi fundada no século «XVI».'],
    [15, 'Os portugueses chegaram ao Brasil no século «XV».'],
  ];
  function romContexto(rng) {
    const tipo = escolher(rng, ['capitulo', 'seculo', 'relogio']);
    if (tipo === 'seculo') {
      const op = SECULOS.filter(s => s[0] <= ROMAN_MAX);
      if (op.length) {
        const [n, frase] = escolher(rng, op);
        return q({ tema: 'romanos', tipo: 'numero', sub: 'seculo', meta: { n, r: paraRomano(n) },
          enunciado: `${frase} Que número é «${paraRomano(n)}»?`, correta: String(n), respostaTexto: `${paraRomano(n)} = ${n}`,
          explicacao: { linhas: [textoDecomposicao(n), ...linhasSubtracao(n)], visual: null } });
      }
    }
    if (tipo === 'relogio' && ROMAN_MAX >= 12) {
      const h = inteiro(rng, 1, 12);
      return q({ tema: 'romanos', tipo: 'numero', sub: 'relogio-romano', meta: { n: h, r: paraRomano(h) }, sufixo: 'horas',
        enunciado: 'Este relógio usa números romanos. Que horas ele está marcando?',
        visual: { kind: 'relogio', h, m: 0, romano: true }, correta: String(h), respostaTexto: `${h} horas (ponteiro pequeno no ${paraRomano(h)})`,
        explicacao: { linhas: [`O ponteiro pequeno (das horas) aponta para o ${paraRomano(h)}.`, textoDecomposicao(h), ...linhasSubtracao(h), 'O ponteiro grande está no XII: hora certinha.'], visual: { kind: 'relogio', h, m: 0, romano: true, destacar: true } } });
    }
    const n = sortearRomano(rng, 5), r = paraRomano(n);
    const quem = escolher(rng, ['Joana', 'Benjamin', 'Lia', 'Pedro']);
    return q({ tema: 'romanos', tipo: 'numero', sub: 'capitulo', meta: { n, r },
      enunciado: `${quem} está lendo o capítulo «${r}» de um livro. Qual é o número desse capítulo?`, correta: String(n), respostaTexto: `${r} = ${n}`,
      explicacao: { linhas: [textoDecomposicao(n), ...linhasSubtracao(n)], visual: null } });
  }

  // ----- dobro e triplo -----
  function sortearMultiplicando(rng, m) {
    const querReserva = rng() < 0.85;
    for (let t = 0; t < 200; t++) {
      const dig = inteiro(rng, 3, 4);
      const primeiro = inteiro(rng, 1, m >= 4 ? 2 : 4);
      let s = String(primeiro);

    escolherFormato, opcoesEscolha, montarFato, estrategia, textoComutativo,
