<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Missão Prova de Matemática</title>
<style>
  :root {
    --fundo: #eef3ff;
    --cartao: #ffffff;
    --texto: #111827;
    --suave: #4b5563;
    --borda: #c7d2fe;
    --azul: #1d4ed8;
    --verde: #15803d;
    --verde-claro: #dcfce7;
    --laranja: #c2410c;
    --laranja-claro: #ffedd5;
    --roxo: #6d28d9;
    --tema: #1d4ed8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: "Segoe UI", "Nunito", system-ui, -apple-system, Roboto, sans-serif;
    font-size: 22px;
    line-height: 1.35;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

  /* ---------- topo ---------- */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: #1e1b4b; color: #fff;
  }
  header h1 { font-size: 22px; flex: 1; min-width: 180px; }
  .chave {
    min-height: 48px; padding: 6px 14px; border-radius: 14px; border: 2px solid #a5b4fc;
    background: transparent; color: #fff; font-size: 18px;
  }
  .chave[aria-pressed="true"] { background: #4338ca; border-color: #fff; }

  /* ---------- trilha do foguete ---------- */
  #trilha { padding: 10px 16px 4px; max-width: 920px; margin: 0 auto; }
  .pista {
    position: relative; height: 56px; border-radius: 28px;
    background: linear-gradient(90deg, #312e81, #1e1b4b);
    overflow: hidden; border: 3px solid #312e81;
  }
  .pista .feito { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6366f1, #a855f7); transition: width .6s ease; }
  .pista .estrelinhas { position: absolute; inset: 0; background-image: radial-gradient(#fff 1px, transparent 1.5px); background-size: 26px 26px; opacity: .35; }
  .pista .foguete { position: absolute; top: 50%; font-size: 34px; transform: translate(-50%, -50%) rotate(45deg); transition: left .6s ease; }
  .pista .lua { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 34px; }
  .contador { text-align: center; font-size: 18px; color: var(--suave); margin-top: 4px; }

  /* ---------- palco ---------- */
  main { max-width: 920px; margin: 0 auto; padding: 8px 16px 32px; }
  .cartao {
    background: var(--cartao); border-radius: 24px; padding: 18px;
    box-shadow: 0 6px 0 #c7d2fe, 0 10px 30px rgba(30, 27, 75, .12);
    border: 3px solid var(--borda);
  }
  .selo {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 999px;
    background: var(--tema); color: #fff; font-weight: 700; font-size: 18px;
  }
  .linha-selo { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .botao-mini {
    min-height: 48px; min-width: 56px; padding: 4px 14px; border-radius: 14px;
    border: 2px solid var(--borda); background: #f5f7ff; font-size: 20px;
  }
  .enunciado { font-size: 27px; font-weight: 600; margin: 6px 0 12px; }
  .rom, .romano-grande, .decomp, .regra .ex, .simbolo .s { font-variant-numeric: lining-nums; }
  .rom { font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: 2px; color: var(--roxo); }
  .visual { display: flex; justify-content: center; margin: 6px 0 12px; }
  .romano-grande { font-family: Georgia, "Times New Roman", serif; font-size: 72px; font-weight: 700; letter-spacing: 6px; color: var(--roxo); }

  .corpo { display: grid; gap: 14px; }
  @media (min-width: 900px) and (orientation: landscape) {
    .corpo.duas { grid-template-columns: 1.15fr 1fr; align-items: start; }
  }

  /* ---------- entrada numérica ---------- */
  .visor {
    min-height: 76px; border-radius: 18px; border: 4px solid var(--azul); background: #f8faff;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 44px; font-weight: 800; letter-spacing: 3px; padding: 4px 12px;
  }
  .visor .vazio { color: #9ca3af; font-weight: 600; }
  .visor .sufixo { font-size: 24px; color: var(--suave); letter-spacing: 0; font-weight: 600; }
  .visor.rom-visor { font-family: Georgia, "Times New Roman", serif; color: var(--roxo); }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .teclado.pecas { grid-template-columns: repeat(var(--n, 4), 1fr); }
  .tecla {
    min-height: 66px; border-radius: 18px; border: 0; background: #e0e7ff; font-size: 32px; font-weight: 800;
    box-shadow: 0 5px 0 #a5b4fc; transition: transform .05s;
  }
  .tecla:active { transform: translateY(4px); box-shadow: 0 1px 0 #a5b4fc; }
  .tecla.ok { background: var(--verde); color: #fff; box-shadow: 0 5px 0 #14532d; }
  .tecla.apagar { background: #fee2e2; box-shadow: 0 5px 0 #fca5a5; font-size: 26px; }
  .tecla.peca { font-family: Georgia, "Times New Roman", serif; color: var(--roxo); font-size: 38px; background: #ede9fe; box-shadow: 0 5px 0 #c4b5fd; }
  .linha-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

  /* ---------- múltipla escolha ---------- */
  .opcoes { display: grid; gap: 12px; }
  .opcoes.grade { grid-template-columns: 1fr 1fr; }
  .opcao {
    min-height: 66px; padding: 10px 16px; border-radius: 18px; border: 3px solid var(--borda);
    background: #f8faff; font-size: 26px; font-weight: 700; text-align: center;
    box-shadow: 0 4px 0 #c7d2fe;
  }
  .opcao.rom { font-size: 34px; }
  .opcao.frase { font-size: 23px; font-weight: 600; text-align: left; }
  .opcao.certa { background: var(--verde-claro); border-color: var(--verde); }
  .opcao.errada { background: var(--laranja-claro); border-color: var(--laranja); }
  .opcao:disabled { cursor: default; }

  /* ---------- ligar colunas ---------- */
  .ligar { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ligar .col { display: grid; gap: 10px; }
  .ligar .opcao.sel { border-color: var(--azul); background: #dbeafe; box-shadow: 0 0 0 4px #93c5fd; }
  .ligar .opcao.feito { background: var(--verde-claro); border-color: var(--verde); opacity: .75; }
  .dica-ligar { font-size: 19px; color: var(--suave); margin-bottom: 8px; }

  /* ---------- conta armada ---------- */
  .etapas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .etapa { padding: 4px 12px; border-radius: 999px; background: #f1f5f9; color: var(--suave); font-size: 18px; font-weight: 700; border: 2px solid #e2e8f0; }
  .etapa.agora { background: var(--tema); color: #fff; border-color: var(--tema); }
  .etapa.ok { background: var(--verde-claro); color: var(--verde); border-color: var(--verde); }
  .conta { display: grid; justify-content: center; gap: 4px 6px; margin: 4px auto; font-variant-numeric: tabular-nums; }
  .conta .c { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; }
  .conta .c.res { cursor: pointer; border: 3px solid #94a3b8; border-radius: 12px; background: #fff; }
  .conta .c.res.ativo { border-color: var(--azul); box-shadow: 0 0 0 4px #93c5fd; }
  .conta .c.vai { height: 38px; font-size: 24px; color: var(--laranja); }
  .conta .c.vai.caixa { cursor: pointer; border: 2px dashed #fdba74; border-radius: 10px; width: 40px; margin: 0 auto; }
  .conta .c.vai.caixa.ativo { border-style: solid; border-color: var(--laranja); box-shadow: 0 0 0 3px #fed7aa; }
  .conta .traco { grid-column: 1 / -1; height: 5px; background: var(--texto); border-radius: 3px; margin: 2px 0; }
  .ajuda-conta { font-size: 18px; color: var(--suave); text-align: center; }
  .aviso { color: var(--laranja); font-weight: 700; text-align: center; min-height: 28px; font-size: 20px; }

  /* ---------- relógio ---------- */
  .relogio-wrap { display: grid; justify-items: center; gap: 6px; }
  .relogio { width: min(68vw, 260px); height: auto; }
  .legenda-relogio { display: grid; gap: 4px; font-size: 20px; }
  .lh { color: #dc2626; font-weight: 800; }
  .lm { color: #2563eb; font-weight: 800; }
  .pulsar { animation: pulsar 1.2s ease-in-out infinite; }
  @keyframes pulsar { 50% { opacity: .45; } }

  /* ---------- explicações ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 6px 0; }
  .chip { position: relative; padding: 8px 12px; border-radius: 14px; background: #f1f5f9; border: 2px solid #cbd5e1; font-weight: 700; font-size: 20px; }
  .chip.inicio { background: #dbeafe; border-color: var(--azul); }
  .chip.conta { background: #fef9c3; border-color: #ca8a04; }
  .chip.destino { background: var(--verde-claro); border-color: var(--verde); }
  .chip.marca { background: #ede9fe; border-color: var(--roxo); }
  .chip .num { position: absolute; top: -12px; right: -8px; background: #ca8a04; color: #fff; border-radius: 999px; font-size: 14px; min-width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  .seta { color: var(--suave); font-weight: 700; font-size: 18px; }
  .tabela-uni { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 20px; max-width: 460px; margin: 6px auto; }
  .tabela-uni div { padding: 6px 10px; border-radius: 10px; background: #f8fafc; }
  .tabela-uni .hl { background: #fef9c3; font-weight: 800; }
  .passos { font-size: 20px; display: grid; gap: 4px; margin: 6px 0; }
  .decomp { font-family: Georgia, "Times New Roman", serif; font-size: 30px; text-align: center; font-weight: 700; color: var(--roxo); margin: 6px 0; }

  /* ---------- overlays ---------- */
  #camada { position: fixed; inset: 0; display: none; z-index: 20; background: rgba(15, 23, 42, .45); align-items: flex-end; justify-content: center; }
  #camada.aberta { display: flex; }
  .folha {
    background: #fff; width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto;
    border-radius: 26px 26px 0 0; padding: 18px 18px 22px; animation: sobe .25s ease-out;
    border-top: 6px solid #f59e0b;
  }
  @keyframes sobe { from { transform: translateY(40px); opacity: 0; } }
  .folha h2 { font-size: 26px; margin-bottom: 6px; }
  .resposta-certa { font-size: 26px; margin: 4px 0 10px; }
  .resposta-certa b { color: var(--verde); }
  .explica { font-size: 21px; display: grid; gap: 6px; }
  .botao-grande {
    display: block; width: 100%; min-height: 66px; margin-top: 14px; border: 0; border-radius: 18px;
    background: var(--azul); color: #fff; font-size: 26px; font-weight: 800; box-shadow: 0 5px 0 #1e3a8a;
  }
  .botao-grande.verde { background: var(--verde); box-shadow: 0 5px 0 #14532d; }
  .botao-grande.claro { background: #e0e7ff; color: var(--texto); box-shadow: 0 5px 0 #a5b4fc; }
  #festa { position: fixed; inset: 0; display: none; z-index: 30; align-items: center; justify-content: center; pointer-events: none; }
  #festa.aberta { display: flex; }
  .festa-caixa { background: #fff; border-radius: 28px; padding: 20px 34px; text-align: center; border: 5px solid #facc15; box-shadow: 0 16px 50px rgba(0,0,0,.25); animation: pop .45s cubic-bezier(.2, 1.6, .5, 1); }
  .festa-caixa .grande { font-size: 70px; }
  .festa-caixa .txt { font-size: 32px; font-weight: 800; color: var(--verde); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .brilho { position: fixed; font-size: 30px; animation: voa .9s ease-out forwards; pointer-events: none; z-index: 31; }
  @keyframes voa { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
  .tremer { animation: tremer .35s; }
  @keyframes tremer { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* ---------- telas ---------- */
  .centro { text-align: center; display: grid; gap: 14px; justify-items: center; }
  .mascote { font-size: 90px; animation: flutua 2.4s ease-in-out infinite; }
  @keyframes flutua { 50% { transform: translateY(-10px); } }
  .titulo { font-size: 34px; font-weight: 800; }
  .sub { font-size: 22px; color: var(--suave); }
  .pilha { display: grid; gap: 12px; width: 100%; max-width: 520px; }
  .regras { display: grid; gap: 12px; }
  .simbolos { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .simbolo { background: #ede9fe; border: 3px solid #c4b5fd; border-radius: 16px; padding: 8px 16px; text-align: center; min-width: 92px; }
  .simbolo .s { font-family: Georgia, "Times New Roman", serif; font-size: 44px; font-weight: 800; color: var(--roxo); line-height: 1.1; }
  .simbolo .v { font-size: 24px; font-weight: 800; }
  .regra { border-radius: 16px; padding: 10px 14px; background: #f8fafc; border-left: 8px solid var(--roxo); font-size: 22px; }
  .regra .ex { font-family: Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 700; margin-top: 4px; }
  .ok-ex { color: var(--verde); } .no-ex { color: #b91c1c; text-decoration: line-through; }
  .estrelas { font-size: 64px; letter-spacing: 8px; }
  .relatorio table { width: 100%; border-collapse: collapse; font-size: 19px; }
  .relatorio th, .relatorio td { border-bottom: 2px solid #e5e7eb; padding: 8px 6px; text-align: left; }
  .relatorio th { background: #eef2ff; }
  .relatorio td.n { text-align: center; }
  .relatorio h3 { margin: 16px 0 6px; font-size: 22px; }
  .relatorio .item { padding: 10px 12px; border-radius: 12px; background: #fff7ed; border: 2px solid #fed7aa; margin-bottom: 8px; font-size: 19px; }
  .relatorio .item .tema { font-weight: 800; color: var(--laranja); font-size: 16px; }
  .relatorio p { font-size: 19px; }
  @media print {
    header, #trilha, .nao-imprimir { display: none !important; }
    body { background: #fff; }
    .cartao { box-shadow: none; border: 0; }
  }
</style>
</head>
<body>
<header>
  <a class="chave" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">🏠 Missões</a>
  <h1>🚀 Missão Prova de Matemática</h1>
  <button class="chave" id="chave-voz" aria-pressed="false" title="Ler as perguntas em voz alta automaticamente">🔊 Ler sozinho</button>
  <button class="chave" id="chave-som" aria-pressed="true" title="Som de comemoração">🔔 Som</button>
</header>
<div id="trilha" hidden>
  <div class="pista" aria-hidden="true">
    <div class="feito" id="trilha-feito" style="width:0%"></div>
    <div class="estrelinhas"></div>
    <div class="lua">🌕</div>
    <div class="foguete" id="trilha-foguete" style="left:6%">🚀</div>
  </div>
  <div class="contador" id="trilha-texto"></div>
</div>
<main id="palco"></main>
<div id="camada" role="dialog" aria-modal="true"><div class="folha" id="folha"></div></div>
<div id="festa" aria-live="polite"><div class="festa-caixa" id="festa-caixa"></div></div>

<!-- ===================== LÓGICA PURA (testada em tests.html) ===================== -->
<script id="logica">
const ROMAN_MAX = 50;

const Logica = (function () {
  'use strict';

  // ---------- aleatório (com semente opcional, para os testes) ----------
  function criarRng(semente) {
    let a = (semente >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const inteiro = (rng, min, max) => min + Math.floor(rng() * (max - min + 1));
  const escolher = (rng, lista) => lista[Math.floor(rng() * lista.length)];
  function embaralhar(rng, lista) {
    const c = lista.slice();
    for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
    return c;
  }
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  // ---------- numerais romanos ----------
  const TABELA_ROMANA = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  const VALOR = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };

  function paraRomano(n) {
    if (!Number.isInteger(n) || n < 1 || n > 3999) throw new RangeError('fora do intervalo: ' + n);
    let s = '';
    for (const [v, sim] of TABELA_ROMANA) while (n >= v) { s += sim; n -= v; }
    return s;
  }
  // valor "solto" (soma/subtrai sem checar regras); null se tiver letra estranha
  function valorSolto(s) {
    if (typeof s !== 'string' || !s) return null;
    s = s.toUpperCase();
    let total = 0;
    for (let i = 0; i < s.length; i++) {
      const v = VALOR[s[i]];
      if (!v) return null;
      const prox = VALOR[s[i + 1]] || 0;
      total += v < prox ? -v : v;
    }
    return total;
  }
  // válido = é exatamente a forma canônica do seu valor (pega IIII, VV, IL, XXXX, VIX...)
  function romanoValido(s) {
    const v = valorSolto(s);
    return v !== null && v >= 1 && v <= 3999 && paraRomano(v) === s.toUpperCase();
  }
  function deRomano(s) { return romanoValido(s) ? valorSolto(s) : null; }

  const SIMBOLOS = ['I', 'V', 'X', 'L', 'C', 'D', 'M'].filter(c => VALOR[c] <= Math.max(ROMAN_MAX, 1) ||
    Array.from({ length: ROMAN_MAX }, (_, i) => paraRomano(i + 1)).some(r => r.includes(c)));
  const COM_SUBTRACAO = [];
  for (let n = 1; n <= ROMAN_MAX; n++) if (/IV|IX|XL|XC|CD|CM/.test(paraRomano(n))) COM_SUBTRACAO.push(n);

  // peso extra nos números com subtração (4, 9, 14, 19, 24, 29, 40–49...)
  function sortearRomano(rng, min = 1, max = ROMAN_MAX) {
    const pool = COM_SUBTRACAO.filter(n => n >= min && n <= max);
    if (pool.length && rng() < 0.6) return escolher(rng, pool);
    return inteiro(rng, min, max);
  }

  function decomporRomano(n) {
    const partes = [];
    let r = n;
    for (const [v, s] of TABELA_ROMANA) while (r >= v) { partes.push({ simbolo: s, valor: v, subtrai: s.length === 2 }); r -= v; }
    return partes;
  }
  function textoDecomposicao(n) {
    const p = decomporRomano(n), rom = paraRomano(n);
    if (p.length === 1) return `${rom} = ${n}`;
    return `${rom} = ${p.map(x => x.simbolo).join(' + ')} = ${p.map(x => x.valor).join(' + ')} = ${n}`;
  }
  function linhasSubtracao(n) {
    return decomporRomano(n).filter(p => p.subtrai).map(p =>
      `${p.simbolo}: o ${p.simbolo[0]} vem ANTES do ${p.simbolo[1]}, então tira → ${VALOR[p.simbolo[1]]} − ${VALOR[p.simbolo[0]]} = ${p.valor}`);
  }
  function formaAditiva(n) { // sem subtração: 4 → IIII, 9 → VIIII, 40 → XXXX
    let s = '', r = n;
    for (const [v, sim] of [[1000, 'M'], [500, 'D'], [100, 'C'], [50, 'L'], [10, 'X'], [5, 'V'], [1, 'I']]) while (r >= v) { s += sim; r -= v; }
    return s;
  }
  function romanoTrocado(n) { // troca o 1º par de subtração: XIV → XVI
    const c = paraRomano(n);
    const t = c.replace(/IV|IX|XL|XC|CD|CM/, m => m[1] + m[0]);
    return t === c ? null : t;
  }
  function distratoresRomanos(n) {
    const certo = paraRomano(n), cands = [];
    const add = s => { if (s && s !== certo && !cands.includes(s) && deRomano(s) !== n) cands.push(s); };
    add(formaAditiva(n));
    if (n === 49) add('IL');
    if (n === 45) add('VL');
    if (n === 99) add('IC');
    if (n === 95) add('VC');
    if (n % 10 === 8) add(certo.replace(/VIII$/, 'IIX'));
    if (n % 10 === 0 && certo.endsWith('X')) add(certo.slice(0, -1) + 'VV');
    if (n % 10 === 5) add(certo.slice(0, -1) + 'IIIII');
    add(romanoTrocado(n));
    const inv = certo.split('').reverse().join('');
    if (!romanoValido(inv)) add(inv);
    for (const k of [n + 1, n - 1, n + 10, n - 10, n + 5, n + 2]) if (k >= 1 && k <= 3999) add(paraRomano(k));
    return cands.slice(0, 3);
  }
  // por que a escolha errada está errada (para a explicação)
  function porqueRomanoErrado(s, n) {
    const up = s.toUpperCase();
    if (/(I{4}|X{4}|C{4}|M{4})/.test(up)) return `${s} está errado: um símbolo pode repetir no máximo 3 vezes seguidas.`;

    nums.forEach((n, k) => {
      const a = k * 30 * Math.PI / 180, r = romano ? 70 : 72;
      const x = 100 + r * Math.sin(a), y = 100 - r * Math.cos(a);
      s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${romano ? (String(n).length > 2 ? 13 : 16) : 21}" font-weight="700" font-family="${romano ? 'Georgia, serif' : 'Segoe UI, sans-serif'}" fill="#111827">${n}</text>`;
    });
    const angH = ((h % 12) + m / 60) * 30, angM = m * 6;
    s += `<line class="${destacar ? 'pulsar' : ''}" x1="100" y1="100" x2="100" y2="58" stroke="#dc2626" stroke-width="11" stroke-linecap="round" transform="rotate(${angH} 100 100)"/>`;
    s += `<line x1="100" y1="100" x2="100" y2="36" stroke="#2563eb" stroke-width="5" stroke-linecap="round" transform="rotate(${angM} 100 100)"/>`;
    s += `<circle cx="100" cy="100" r="7" fill="#111827"/></svg>`;
    if (!destacar) return `<div class="relogio-wrap">${s}</div>`;
    return `<div class="relogio-wrap">${s}<div class="legenda-relogio"><div class="lh">● ponteiro PEQUENO e grosso = HORA</div><div class="lm">● ponteiro GRANDE e fino = MINUTOS</div></div></div>`;
  }
  function htmlVisual(v) {
    if (!v) return '';
    if (v.kind === 'romano') return `<div class="romano-grande">${esc(v.texto)}</div>`;
    if (v.kind === 'relogio') return svgRelogio(v);
    if (v.kind === 'linha') {
      return `<div class="chips">` + v.pontos.map((p, i) => (i ? `<span class="seta">+${p.pulo} →</span>` : '') +
        `<span class="chip ${i === 0 ? 'inicio' : i === v.pontos.length - 1 ? 'destino' : 'conta'}">${esc(p.t)}</span>`).join('') + `</div>`;
    }
    if (v.kind === 'sequencia') {
      return `<div class="chips">` + v.itens.map((t, i) => `<span class="chip ${v.destaques[i] || ''}">${esc(t)}</span>`).join('') + `</div>`;
    }
    if (v.kind === 'caminho') {
      return `<div class="chips">` + v.itens.map((it, i) => (i ? '<span class="seta">→</span>' : '') +
        `<span class="chip ${it.marca || ''}">${esc(it.texto)}${it.num ? `<span class="num">${it.num}</span>` : ''}</span>`).join('') + `</div>`;
    }
    if (v.kind === 'unidades') {
      return `<div class="tabela-uni">` + L.UNIDADES.map(u => {
        const hl = v.destaque === u.nome ? ' class="hl"' : '';
        return `<div${hl}>${esc(L.cap(u.nome))}</div><div${hl}>${u.valor} ${esc(u.uni)}</div>`;
      }).join('') + `</div>`;
    }
    return '';
  }

  // ---------- comemoração e explicação ----------
  const ELOGIOS = ['Muito bem!', 'Isso aí!', 'Mandou bem!', 'Perfeito!', 'Arrasou!', 'Show!', 'Acertou!'];
  function festa(msg, depois) {
    plim();
    const caixa = $('#festa-caixa');
    caixa.innerHTML = `<div class="grande">${['⭐', '🌟', '🚀', '🎉'][Math.floor(Math.random() * 4)]}</div><div class="txt">${esc(msg || ELOGIOS[Math.floor(Math.random() * ELOGIOS.length)])}</div>`;
    $('#festa').classList.add('aberta');
    for (let i = 0; i < 10; i++) {
      const b = document.createElement('div');
      b.className = 'brilho'; b.textContent = ['✨', '⭐', '💫'][i % 3];
      b.style.left = '50%'; b.style.top = '45%';
      const ang = i / 10 * Math.PI * 2;
      b.style.setProperty('--dx', Math.cos(ang) * 180 + 'px'); b.style.setProperty('--dy', Math.sin(ang) * 160 + 'px');
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 950);
    }
    setTimeout(() => { $('#festa').classList.remove('aberta'); depois && depois(); }, 1150);
  }
  function abrirFolha(html, aoFechar, rotulo = 'Entendi 👍') {
    $('#folha').innerHTML = html + `<button class="botao-grande">${rotulo}</button>`;
    $('#camada').classList.add('aberta');
    $('#folha .botao-grande').onclick = () => { calar(); $('#camada').classList.remove('aberta'); aoFechar && aoFechar(); };
  }
  function explicar(certaTexto, linhas, visual, extra, aoFechar, rodape) {
    const html = `<h2>Vamos ver juntos 💡</h2>
      <div class="resposta-certa">A resposta certa é: <b>${certaTexto}</b></div>
      ${extra || ''}
      <div class="visual">${visual || ''}</div>
      <div class="explica">${linhas.map(l => `<p>${marcarRomanos(l)}</p>`).join('')}</div>
      ${rodape ? `<p style="font-size:19px;color:#4b5563;margin-top:8px">${rodape}</p>` : ''}`;
    abrirFolha(html, aoFechar);
    if (estado.prefs.voz) falar('A resposta certa é ' + L.paraFala(certaTexto.replace(/<[^>]+>/g, '')) + '. ' + linhas.map(L.paraFala).join('. '));
  }

  // ---------- telas ----------
  function telaInicio() {
    teclas = null;
    pintarTrilha();
    $('#trilha').hidden = true;
    const m = estado.missao, emAndamento = m && !m.finalizada;
    palco.innerHTML = `<div class="cartao centro">
      <div class="mascote">🚀</div>
      <div class="titulo">Missão: revisar para a prova!</div>
      <div class="sub">Vamos treinar números romanos, contas de dobro e triplo, relógio, calendário e unidades de tempo.<br>Sem pressa: pense com calma em cada pergunta. 🙂</div>
      <div class="pilha">
        ${emAndamento ? `<button class="botao-grande verde" id="b-continuar">Continuar a missão (${L.progresso(m).feitas} de ${L.progresso(m).total}) ▶</button>` : ''}
        <button class="botao-grande ${emAndamento ? 'claro' : 'verde'}" id="b-nova">${emAndamento ? 'Começar uma missão nova' : 'Começar a missão! 🚀'}</button>
        ${estado.ultimoRelatorio ? `<button class="botao-grande claro" id="b-rel">📋 Relatório para o papai (última missão)</button>` : ''}
      </div></div>`;
    if (emAndamento) $('#b-continuar').onclick = proxima;
    $('#b-nova').onclick = () => { if (emAndamento && !confirm('Começar de novo? A missão de agora será apagada.')) return; novaMissao(); };
    if (estado.ultimoRelatorio) $('#b-rel').onclick = () => telaRelatorio(estado.ultimoRelatorio);
  }
  function novaMissao() {
    estado.missao = L.criarMissao(Math.random, estado.errosPorTema);
    salvar();
    proxima();
  }
  function proxima() {
    const m = estado.missao;
    pintarTrilha();
    if (m.finalizada) return telaFim();
    const p = L.perguntaAtual(m);
    if (p.tema === 'romanos' && !m.regrasVistas) return telaRegras(() => { m.regrasVistas = true; salvar(); proxima(); });
    renderPergunta(p);
  }

  function telaRegras(depois) {
    teclas = { ok: depois };
    const temC = L.ROMAN_MAX >= 100;
    const sims = [['I', 1], ['V', 5], ['X', 10], ['L', 50]].concat(temC ? [['C', 100]] : []);
    palco.innerHTML = `<div class="cartao regras">
      <div class="linha-selo"><span class="selo" style="background:#6d28d9">🏛️ Cartão de regras — números romanos</span></div>
      <div class="simbolos">${sims.map(([s, v]) => `<div class="simbolo"><div class="s">${s}</div><div class="v">${v}</div></div>`).join('')}</div>
      <div class="regra">1️⃣ Um símbolo repete <b>no máximo 3 vezes</b>.
        <div class="ex"><span class="ok-ex">III = 3 ✔</span> &nbsp; <span class="no-ex">IIII</span> ✘ &nbsp; <span class="ok-ex">XXX = 30 ✔</span> &nbsp; <span class="no-ex">XXXX</span> ✘</div></div>
      <div class="regra">2️⃣ Menor <b>DEPOIS</b> do maior: <b>SOMA</b>.
        <div class="ex">VI = 5 + 1 = 6 &nbsp;·&nbsp; XI = 10 + 1 = 11 &nbsp;·&nbsp; XV = 15</div></div>
      <div class="regra">3️⃣ Menor <b>ANTES</b> do maior: <b>SUBTRAI</b>.
        <div class="ex">IV = 5 − 1 = 4 &nbsp;·&nbsp; IX = 10 − 1 = 9 &nbsp;·&nbsp; XL = 50 − 10 = 40${temC ? ' &nbsp;·&nbsp; XC = 90' : ''}</div></div>
      <div class="regra">⭐ V e L nunca se repetem: <span class="no-ex">VV</span> ✘ (o certo é X).</div>
      <button class="botao-grande verde" id="b-sei">Já sei, vamos! 👍</button></div>`;
    $('#b-sei').onclick = depois;
    if (estado.prefs.voz) falar('Cartão de regras dos números romanos. I vale 1, V vale 5, X vale 10, L vale 50. Um símbolo repete no máximo 3 vezes. Menor depois do maior soma: V I é 6. Menor antes do maior subtrai: I V é 4.');
  }

  function cabecalho(p) {
    const t = L.TEMAS[p.tema];
    document.documentElement.style.setProperty('--tema', t.cor);
    return `<div class="linha-selo"><span class="selo">${t.icone} ${esc(t.nome)}</span>
      <span>${p.tema === 'romanos' ? '<button class="botao-mini" id="b-regras" aria-label="Ver regras">📜 Regras</button> ' : ''}${temVoz ? '<button class="botao-mini" id="b-falar" aria-label="Ler a pergunta">🔊</button>' : ''}</span></div>`;
  }
  function ligarCabecalho(p) {
    const bf = $('#b-falar'); if (bf) bf.onclick = () => falar(p.fala);
    const br = $('#b-regras'); if (br) br.onclick = () => telaRegras(() => renderPergunta(p));
  }

  function renderPergunta(p) {
    calar();
    teclas = null;
    if (p.tipo === 'mult') return renderMult(p);
    const temVisual = !!p.visual;
    palco.innerHTML = `<div class="cartao">${cabecalho(p)}
      <div class="corpo ${temVisual || p.tipo !== 'escolha' ? 'duas' : ''}">
        <div><div class="enunciado">${marcarRomanos(p.enunciado)}</div>${temVisual ? `<div class="visual">${htmlVisual(p.visual)}</div>` : ''}</div>
        <div id="area"></div>
      </div></div>`;
    ligarCabecalho(p);
    const area = $('#area');
    if (p.tipo === 'numero') entradaNumero(area, p.sufixo, v => concluir(p, L.verificar(p, v), v));
    else if (p.tipo === 'romano') entradaRomano(area, v => concluir(p, L.verificar(p, v), v));
    else if (p.tipo === 'escolha') entradaEscolha(area, p.opcoes, p.correta, { romanas: p.opcoesRomanas }, v => concluir(p, v === p.correta, v));
    else if (p.tipo === 'ligar') entradaLigar(area, p);
    if (estado.prefs.voz) falar(p.fala);
  }

  // ----- entradas -----
  function entradaNumero(area, sufixo, aoOk) {
    let valor = '';
    area.innerHTML = `<div class="visor" id="visor"></div>
      <div class="teclado">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="tecla" data-d="${n}">${n}</button>`).join('')}
        <button class="tecla apagar" data-a="1" aria-label="Apagar">⌫</button><button class="tecla" data-d="0">0</button><button class="tecla ok" data-ok="1">OK</button></div>
      <div class="aviso" id="aviso"></div>`;
    const visor = area.querySelector('#visor');
    const pintar = () => { visor.innerHTML = (valor ? esc(valor) : '<span class="vazio">?</span>') + (sufixo ? ` <span class="sufixo">${esc(sufixo)}</span>` : ''); };
    const ok = () => { if (!valor) { visor.classList.remove('tremer'); void visor.offsetWidth; visor.classList.add('tremer'); return; } teclas = null; aoOk(valor); };
    teclas = {
      digito: d => { if (valor.length < 5) { valor = (valor === '0' ? '' : valor) + d; pintar(); } },
      apagar: () => { valor = valor.slice(0, -1); pintar(); },
      ok,
    };
    area.querySelector('.teclado').onclick = ev => {
      const b = ev.target.closest('button'); if (!b || !teclas) return;
      if (b.dataset.d) teclas.digito(b.dataset.d); else if (b.dataset.a) teclas.apagar(); else if (b.dataset.ok) teclas.ok();
    };
    pintar();
  }
  function entradaRomano(area, aoOk) {
    let valor = '';
    const sims = L.SIMBOLOS;
    area.innerHTML = `<div class="visor rom-visor" id="visor"></div>
      <div class="teclado pecas" style="--n:${sims.length}">${sims.map(s => `<button class="tecla peca" data-l="${s}">${s}</button>`).join('')}</div>
      <div class="linha-acoes"><button class="tecla apagar" data-a="1">⌫ Apagar</button><button class="tecla ok" data-ok="1">OK</button></div>
      <div class="aviso" id="aviso"></div>`;
    const visor = area.querySelector('#visor');
    const pintar = () => { visor.innerHTML = valor ? esc(valor) : '<span class="vazio">toque nas peças</span>'; };
    teclas = {
      letra: l => { if (sims.includes(l) && valor.length < 12) { valor += l; pintar(); } },
      apagar: () => { valor = valor.slice(0, -1); pintar(); },
      ok: () => { if (!valor) { visor.classList.remove('tremer'); void visor.offsetWidth; visor.classList.add('tremer'); return; } teclas = null; aoOk(valor); },
    };
    area.onclick = ev => {
      const b = ev.target.closest('button'); if (!b || !teclas) return;
      if (b.dataset.l) teclas.letra(b.dataset.l); else if (b.dataset.a) teclas.apagar(); else if (b.dataset.ok) teclas.ok();
    };
    pintar();
  }
  function entradaEscolha(area, opcoes, correta, o, aoEscolher) {
    const curtas = opcoes.every(x => String(x).length <= 12);
    const cls = o.romanas ? 'rom' : o.frase ? 'frase' : '';
    area.innerHTML = `<div class="opcoes ${curtas && opcoes.length > 2 ? 'grade' : curtas && opcoes.length === 2 ? 'grade' : ''}">
      ${opcoes.map((x, i) => `<button class="opcao ${cls}" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
    const botoes = Array.from(area.querySelectorAll('.opcao'));
    const escolher = i => {
      if (i < 0 || i >= opcoes.length) return;
      teclas = null;
      botoes.forEach(b => { b.disabled = true; });
      const v = opcoes[i];
      botoes[i].classList.add(v === correta ? 'certa' : 'errada');
      if (v !== correta) botoes[opcoes.indexOf(correta)].classList.add('certa');
      setTimeout(() => aoEscolher(v), v === correta ? 150 : 700);
    };
    teclas = { opcao: escolher };
    area.querySelector('.opcoes').onclick = ev => { const b = ev.target.closest('.opcao'); if (b && !b.disabled) escolher(Number(b.dataset.i)); };
  }
  function entradaLigar(area, p) {
    const esq = p.pares.map(x => x[0]), dir = p.direita, mapa = Object.fromEntries(p.pares);
    area.innerHTML = `<div class="dica-ligar">Toque numa palavra e depois no tempo que combina.</div>
      <div class="ligar"><div class="col">${esq.map((t, i) => `<button class="opcao" data-lado="e" data-i="${i}">${esc(t)}</button>`).join('')}</div>
      <div class="col">${dir.map((t, i) => `<button class="opcao" data-lado="d" data-i="${i}">${esc(t)}</button>`).join('')}</div></div>`;
    let sel = null, feitos = 0, encerrado = false;
    area.querySelector('.ligar').onclick = ev => {
      const b = ev.target.closest('.opcao'); if (!b || b.disabled || encerrado) return;
      if (!sel || sel.dataset.lado === b.dataset.lado) {
        if (sel) sel.classList.remove('sel');
        sel = b; b.classList.add('sel'); return;
      }
      const e = sel.dataset.lado === 'e' ? sel : b, d = sel.dataset.lado === 'e' ? b : sel;
      sel.classList.remove('sel'); sel = null;
      const te = esq[Number(e.dataset.i)], td = dir[Number(d.dataset.i)];
      if (mapa[te] === td) {
        e.classList.add('feito'); d.classList.add('feito'); e.disabled = d.disabled = true;
        if (++feitos === esq.length) { encerrado = true; concluir(p, true, ''); }
      } else {
        encerrado = true;
        e.classList.add('errada'); d.classList.add('errada');
        setTimeout(() => concluir(p, false, `${te} = ${td}`), 700);
      }
    };
  }

  // ----- dobro e triplo: S.M. → Cálculo → R: -----
  function htmlConta(c, modo, est) {
    const dig = String(c.a).split(''), n = dig.length, cols = n + 1;
    const reservaEm = i => { const r = n - i; const pa = c.passos[r]; return pa && r >= 1 ? pa.reserva : 0; }; // reserva que chega na coluna i
    let h = `<div class="conta" style="grid-template-columns: repeat(${cols}, 54px)">`;
    for (let i = 0; i < cols; i++) {
      if (i >= 1 && i < n) {
        if (modo === 'entrada') h += `<div class="c vai caixa ${est.ativo.lin === 'v' && est.ativo.i === i ? 'ativo' : ''}" data-v="${i}">${esc(est.vai[i] || '')}</div>`;
        else h += `<div class="c vai">${reservaEm(i) || ''}</div>`;
      } else h += `<div class="c vai"></div>`;
    }
    h += `<div class="c"></div>` + dig.map(d => `<div class="c">${d}</div>`).join('');
    h += `<div class="c">×</div>` + Array.from({ length: n - 1 }, () => `<div class="c"></div>`).join('') + `<div class="c">${c.m}</div>`;
    h += `<div class="traco"></div>`;
    const res = String(c.resultado).padStart(cols, ' ');
    for (let i = 0; i < cols; i++) {
      if (modo === 'entrada') h += `<div class="c res ${est.ativo.lin === 'r' && est.ativo.i === i ? 'ativo' : ''}" data-r="${i}">${esc(est.res[i] || '')}</div>`;
      else h += `<div class="c res" style="border-color:#15803d">${res[i].trim()}</div>`;
    }
    return h + '</div>';
  }
  function renderMult(p) {
    const st = { etapa: 1, errou: false };
    const desenhar = () => {
      const et = (k, nome) => `<span class="etapa ${st.etapa === k ? 'agora' : st.etapa > k ? 'ok' : ''}">${k} ${nome}</span>`;
      palco.innerHTML = `<div class="cartao">${cabecalho(p)}
        <div class="etapas">${et(1, 'S.M.')}${et(2, 'Cálculo')}${et(3, 'R:')}</div>
        <div class="corpo duas"><div><div class="enunciado" style="font-size:24px">${esc(p.enunciado)}</div>
        <div id="pergunta-etapa" class="enunciado" style="color:var(--tema)"></div></div><div id="area"></div></div></div>`;
      ligarCabecalho(p);
      const area = $('#area'), pe = $('#pergunta-etapa');
      if (st.etapa === 1) {
        pe.textContent = 'S.M. — Qual é a sentença matemática?';
        entradaEscolha(area, p.sm.opcoes, p.sm.correta, {}, v => {
          const ok = v === p.sm.correta;
          const nome = p.meta.m === 2 ? 'Dobro = 2 vezes' : p.meta.m === 3 ? 'Triplo = 3 vezes' : `${L.cap(p.enunciado.match(/o (quádruplo|quíntuplo)/)?.[1] || 'vezes')} = ${p.meta.m} vezes`;
          avancar(ok, p.sm.correta, [`${nome}. Quando é "vezes", a conta é de MULTIPLICAÇÃO (×), não de mais (+).`, `Então: ${p.sm.correta}`]);
        });
      } else if (st.etapa === 2) {
        pe.textContent = `Cálculo — Arme e faça: ${p.meta.a} × ${p.meta.m}`;
        entradaConta(area, p);
      } else {
        pe.textContent = 'R: — Qual é a resposta completa?';
        entradaEscolha(area, p.r.opcoes, p.r.correta, { frase: true }, v => {
          avancar(v === p.r.correta, esc(p.r.correta), ['A resposta precisa ter o número certo da conta e responder o que a pergunta quer saber.', `${p.meta.a} × ${p.meta.m} = ${p.conta.resultado}`]);
        });
      }
      if (estado.prefs.voz) falar(st.etapa === 1 ? p.fala + '. Qual é a sentença matemática?' : st.etapa === 2 ? 'Agora faça a conta, começando pela direita.' : 'Qual é a resposta completa?');
    };
    const avancar = (ok, certaTxt, linhas, visual) => {
      if (!ok) st.errou = true;
      const seguir = () => {
        if (st.etapa < 3) { st.etapa++; desenhar(); return; }
        L.registrar(estado.missao, !st.errou); salvar();
        if (!st.errou) festa('Problema resolvido! 🏆', proxima); else proxima();
      };
      if (ok) { if (st.etapa < 3) { plim(); setTimeout(seguir, 450); } else seguir(); }
      else explicar(certaTxt, linhas, visual, '', seguir, st.etapa === 3 ? 'Esse problema volta no fim da fila para você treinar de novo. 💪' : '');
    };
    function entradaConta(area, p) {
      const n = String(p.meta.a).length, cols = n + 1;
      const est = { res: Array(cols).fill(''), vai: Array(cols).fill(''), ativo: { lin: 'r', i: cols - 1 } };
      const pintar = () => {
        area.innerHTML = `${htmlConta(p.conta, 'entrada', est)}
          <div class="ajuda-conta">Comece pela DIREITA ⬅️ · o quadradinho de cima é para a reserva (o "vai um")</div>
          <div class="teclado">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button class="tecla" data-d="${k}">${k}</button>`).join('')}
          <button class="tecla apagar" data-a="1" aria-label="Apagar">⌫</button><button class="tecla" data-d="0">0</button><button class="tecla ok" data-ok="1">OK</button></div>
          <div class="aviso" id="aviso"></div>`;
      };
      const proximoVazio = () => { for (let i = cols - 1; i >= 0; i--) if (!est.res[i]) return i; return 0; };
      teclas = {
        digito: d => {
          if (est.ativo.lin === 'v') { est.vai[est.ativo.i] = d; est.ativo = { lin: 'r', i: proximoVazio() }; }
          else { est.res[est.ativo.i] = d; if (est.ativo.i > 0) est.ativo = { lin: 'r', i: est.ativo.i - 1 }; }
          pintar();
        },
        apagar: () => {
          if (est.ativo.lin === 'v') est.vai[est.ativo.i] = '';
          else if (est.res[est.ativo.i]) est.res[est.ativo.i] = '';
          else if (est.ativo.i < cols - 1) { est.ativo.i++; est.res[est.ativo.i] = ''; }
          pintar();
        },
        ok: () => {
          const f = est.res.findIndex(x => x !== '');
          if (f < 0 || est.res.slice(f).some(x => x === '')) { pintar(); area.querySelector('#aviso').textContent = 'Complete os quadradinhos da direita para a esquerda 🙂'; return; }
          teclas = null;
          const v = Number(est.res.join(''));
          avancar(v === p.conta.resultado, String(p.conta.resultado), L.linhasConta(p.conta), htmlConta(p.conta, 'solucao'));
        },
      };
      area.onclick = ev => {
        const b = ev.target.closest('[data-d],[data-a],[data-ok],[data-r],[data-v]'); if (!b || !teclas) return;
        if (b.dataset.d) teclas.digito(b.dataset.d);
        else if (b.dataset.a) teclas.apagar();
        else if (b.dataset.ok) teclas.ok();
        else if (b.dataset.r !== undefined) { est.ativo = { lin: 'r', i: Number(b.dataset.r) }; pintar(); }
        else if (b.dataset.v !== undefined) { est.ativo = { lin: 'v', i: Number(b.dataset.v) }; pintar(); }
      };
      pintar();
    }
    desenhar();
  }

  // ----- depois de responder -----
  function concluir(p, acertou, resposta) {
    L.registrar(estado.missao, acertou);
    salvar();
    if (acertou) { festa(null, proxima); return; }
    let linhas = p.explicacao.linhas.slice(), extra = '';
    if (p.sub === 'certo' && resposta) linhas.unshift(L.porqueRomanoErrado(resposta, p.meta.n));
    if (p.tema === 'romanos' && p.tipo === 'romano' && resposta) {
      const v = L.deRomano(resposta);
      linhas.unshift(v !== null ? `Você montou ${resposta}, que vale ${v}.` : L.porqueRomanoErrado(resposta, p.meta.n));
    }
    if (p.tipo === 'ligar') extra = `<p>${esc(resposta)} não combina. Veja os pares certos:</p>`;
    const certa = p.tipo === 'ligar' ? 'os pares abaixo' : p.tipo === 'romano' || p.opcoesRomanas ? `<span class="rom">${esc(p.correta)}</span>` : esc(p.correta) + (p.sufixo ? ' ' + esc(p.sufixo) : '');
    let decomp = '';
    if (p.tema === 'romanos' && p.sub !== 'comparar') {
      const d = L.textoDecomposicao(p.meta.n);
      decomp = `<div class="decomp">${esc(d)}</div>`;
      linhas = linhas.filter(l => l !== d);
    }
    explicar(certa, linhas, decomp + htmlVisual(p.explicacao.visual), extra, proxima, 'Essa pergunta volta no fim da fila. 💪');
  }

  function telaFim() {
    teclas = null;
    calar();
    const m = estado.missao;
    const rel = L.relatorio(m);
    if (!m.relatorioSalvo) {
      estado.ultimoRelatorio = rel;
      estado.errosPorTema = L.errosPorTema(m);
      m.relatorioSalvo = true;
      salvar();
    }
    document.documentElement.style.setProperty('--tema', '#1d4ed8');
    palco.innerHTML = `<div class="cartao centro">
      <div class="mascote">🧑‍🚀</div>
      <div class="titulo">MISSÃO CUMPRIDA! 🎉</div>
      <div class="estrelas">⭐⭐⭐</div>
      <div class="sub">Você acertou todas as ${rel.total} perguntas!<br>${rel.dePrimeira} delas de primeira. Que esforço bonito! 💪</div>
      <div class="pilha">
        <button class="botao-grande" id="b-rel">📋 Relatório para o papai</button>
        <button class="botao-grande verde" id="b-denovo">🔁 Jogar de novo (perguntas novas)</button>
      </div></div>`;
    $('#b-rel').onclick = () => telaRelatorio(estado.ultimoRelatorio);
    $('#b-denovo').onclick = novaMissao;
    festa('Missão cumprida!');
    if (estado.prefs.voz) setTimeout(() => falar(`Missão cumprida! Você acertou todas as ${rel.total} perguntas!`), 1200);
  }

  function telaRelatorio(r) {
    teclas = null;
    $('#trilha').hidden = true;
    palco.innerHTML = `<div class="cartao relatorio">
      <div class="titulo" style="font-size:28px">📋 Relatório para o papai</div>
      <p>Missão de ${esc(r.data)} · ${r.total} perguntas · <b>${r.dePrimeira}</b> certas de primeira (${Math.round(r.dePrimeira / r.total * 100)}%)</p>
      <h3>Por tema</h3>
      <table><tr><th>Tema</th><th class="n">Perguntas</th><th class="n">De primeira</th><th class="n">Repetiu</th></tr>
      ${r.porTema.map(t => `<tr><td>${t.icone} ${esc(t.nome)}</td><td class="n">${t.perguntas}</td><td class="n">${t.dePrimeira}</td><td class="n">${t.repetidas ? `<b style="color:#c2410c">${t.repetidas}</b>` : '0'}</td></tr>`).join('')}
      </table>
      <h3>Pontos para revisar no papel antes da prova</h3>
      ${r.repetir.length ? r.repetir.map(x => `<div class="item"><div class="tema">${esc(x.tema)} · ${x.tentativas} tentativas</div>${esc(x.enunciado)}${x.visual ? ` <i>(${esc(x.visual)})</i>` : ''}<br><b>Resposta:</b> ${esc(x.resposta)}</div>`).join('') : '<p>Nenhum! Acertou tudo de primeira. 🌟</p>'}
      <div class="pilha nao-imprimir" style="max-width:none">
        <button class="botao-grande claro" id="b-copiar">📄 Copiar relatório</button>
        <button class="botao-grande claro" id="b-imprimir">🖨️ Imprimir</button>
        <button class="botao-grande" id="b-voltar">⬅ Voltar</button>
      </div><div class="aviso" id="aviso"></div></div>`;
    $('#b-copiar').onclick = () => {
      const txt = L.relatorioTexto(r);
      const pronto = () => { $('#aviso').textContent = 'Copiado! ✔'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(pronto, () => copiaVelha(txt, pronto));
      else copiaVelha(txt, pronto);
    };
    $('#b-imprimir').onclick = () => window.print();
    $('#b-voltar').onclick = () => (estado.missao && estado.missao.finalizada ? telaFim() : telaInicio());
  }
  function copiaVelha(txt, pronto) {
    const t = document.createElement('textarea');
    t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); pronto(); } catch (e) {}
    t.remove();
  }

  telaInicio();
})();
</script>
</body>
