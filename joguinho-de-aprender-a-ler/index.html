<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b794f6">
<title>Joguinho de Aprender a Ler</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
<style>
  :root {
    --l50: #faf7ff; --l100: #f3ecff; --l200: #e6d9ff; --l300: #d2bcff; --l400: #b794f6; --l500: #9b6cf0; --l600: #7c4ddb; --l700: #5f35b5; --l800: #46278a;
    --tinta: #3d2a63; --suave: #7a6a99; --verde: #22c55e; --verde-esc: #15803d; --rosa: #ec4899; --amarelo: #fcd34d;
    --sombra: 0 6px 0 rgba(95, 53, 181, .16), 0 10px 22px rgba(95, 53, 181, .12);
    --fonte: "Nunito", "Varela Round", "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--fonte); color: var(--tinta); background: linear-gradient(180deg, #fbf8ff 0%, var(--l100) 45%, var(--l200) 100%); background-attachment: fixed;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
  #palco { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; max-width: 1080px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

  /* ---------- peças comuns ---------- */
  .contador { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 900; font-size: clamp(18px, 3vw, 24px); box-shadow: var(--sombra); white-space: nowrap; }
  .contador.peq { font-size: 18px; padding: 4px 12px; }
  .b-x { width: 48px; height: 48px; border-radius: 50%; background: #fff; font-size: 22px; font-weight: 900; box-shadow: var(--sombra); color: var(--l700); flex: none; }
  .barra { display: flex; align-items: center; gap: 10px; }
  .barra h2 { flex: 1; margin: 0; font-size: clamp(20px, 4vw, 30px); font-weight: 900; color: var(--l700); letter-spacing: .5px; }
  .b-grande { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 84px; border-radius: 28px; padding: 10px 18px;
    font-size: clamp(26px, 5vw, 38px); font-weight: 900; color: #fff; background: linear-gradient(180deg, var(--l500), var(--l600));
    box-shadow: 0 8px 0 var(--l800), 0 14px 26px rgba(70, 39, 138, .3); letter-spacing: 1px; transition: transform .08s; }
  .b-grande:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--l800); }
  .b-grande.verde { background: linear-gradient(180deg, #34d399, var(--verde)); box-shadow: 0 8px 0 var(--verde-esc), 0 14px 26px rgba(21, 128, 61, .25); }
  .b-nav { background: #fff; border-radius: 22px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900;
    font-size: clamp(12px, 2.4vw, 16px); box-shadow: var(--sombra); color: var(--l700); letter-spacing: .5px; }
  .b-nav .ic { font-size: clamp(30px, 6vw, 42px); line-height: 1; }
  .b-nav.largo { flex-direction: row; justify-content: center; font-size: clamp(16px, 3vw, 20px); padding: 14px; gap: 10px; }
  .acesa { outline: 6px solid var(--amarelo); outline-offset: 3px; }

  /* ---------- cena do panda ---------- */
  .cena { position: relative; display: block; width: min(100%, 400px); aspect-ratio: 200 / 220; margin: 0 auto; border-radius: 28px; overflow: hidden; box-shadow: var(--sombra); background: #fff; }
  .cena > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cena > .panda-svg { inset: 4% 6% 0; width: 88%; height: 96%; }
  .panda-svg .olho { animation: pisca 4.5s infinite; transform-box: fill-box; transform-origin: center; }
  .pula { animation: pulo .6s ease; }
  .inclina { animation: inclina .8s ease; }
  .dancando > .panda-svg { animation: danca 1s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes pisca { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes pulo { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14%); } 70% { transform: translateY(2%); } }
  @keyframes inclina { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-8deg); } 70% { transform: rotate(5deg); } }
  @keyframes danca { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-3%); } }

  /* ---------- abertura ---------- */
  .splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .splash .cena { width: min(80vw, 46vh, 360px); }
  .titulo-splash { margin: 0; font-size: clamp(30px, 7vw, 54px); font-weight: 900; color: var(--l700); line-height: 1.05; letter-spacing: 1px; }
  .splash .b-grande { max-width: 420px; }

  /* ---------- casa ---------- */
  .casa { flex: 1; display: grid; grid-template-columns: 1fr; gap: 14px; align-content: start; }
  .topo { display: flex; align-items: center; gap: 10px; }
  .titulo { flex: 1; font-weight: 900; font-size: clamp(17px, 3.4vw, 30px); letter-spacing: .5px; color: var(--l700); line-height: 1.05; }
  .cadeado { width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, .65); font-size: 20px; position: relative; flex: none; }
  .cadeado.segurando::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 5px solid var(--l500); border-right-color: transparent; animation: girar 3s linear forwards; }
  @keyframes girar { to { transform: rotate(1080deg); } }
  .col-cena { position: relative; }
  .col-cena .cena { width: min(100%, 50vh, 460px); }
  .balao-casa { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); background: #fff; border-radius: 20px; padding: 8px 16px; font-weight: 900;
    font-size: clamp(16px, 3vw, 22px); color: var(--l700); box-shadow: var(--sombra); white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  .col-acoes { display: flex; flex-direction: column; gap: 14px; }
  .missoes { display: flex; justify-content: center; gap: 14px; }
  .bolinha { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 900; background: #fff; color: var(--l400); box-shadow: var(--sombra); }
  .bolinha.feita { background: var(--amarelo); color: #fff; }
  .navega { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (min-width: 760px) and (orientation: landscape) {
    .casa { grid-template-columns: 1.1fr 1fr; align-items: center; column-gap: 28px; }
    .casa .topo { grid-column: 1 / -1; }
    .col-cena .cena { width: min(100%, 70vh, 440px); }
  }

  /* ---------- missão ---------- */
  .missao { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .trilho { flex: 1; height: 18px; background: rgba(255, 255, 255, .75); border-radius: 999px; overflow: hidden; }
  .trilho > i { display: block; height: 100%; background: linear-gradient(90deg, var(--l400), var(--rosa)); border-radius: 999px; transition: width .4s; }
  .quadro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 2.6vh, 26px); padding: 6px 0; }
  .enunciado { display: flex; align-items: center; gap: 12px; font-size: clamp(16px, 2.8vw, 24px); font-weight: 900; color: var(--l700); text-align: left; }
  .b-ouvir { width: 58px; height: 58px; border-radius: 50%; background: var(--l500); color: #fff; font-size: 26px; box-shadow: 0 5px 0 var(--l700); flex: none; }
  .estimulo { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cartao { background: #fff; border-radius: 26px; box-shadow: var(--sombra); display: grid; place-items: center; line-height: 1; }
  .figura { width: clamp(118px, 25vmin, 190px); aspect-ratio: 1; font-size: clamp(66px, 15vmin, 118px); }
  .figura.media { width: clamp(96px, 19vmin, 150px); font-size: clamp(54px, 12vmin, 92px); }
  .figura.som { font-size: clamp(54px, 12vmin, 90px); background: var(--l100); }
  .opcoes { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 2.4vw, 22px); width: 100%; }
  .op { background: #fff; border-radius: 24px; box-shadow: var(--sombra); display: grid; place-items: center; line-height: 1; transition: transform .12s, opacity .2s; position: relative; }
  .op:active { transform: scale(.96); }
  .op.fig { width: clamp(92px, 26vw, 170px); aspect-ratio: 1; font-size: clamp(50px, 13vw, 98px); }
  .op.dupla { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2px; font-size: clamp(38px, 9vw, 70px); }
  .op.dupla.empilha { flex-direction: column; gap: 0; }
  .op.dupla.empilha span { font-size: .8em; margin-top: -.18em; }
  .op.letra { width: clamp(84px, 24vw, 132px); aspect-ratio: 1; font-size: clamp(46px, 12vw, 80px); font-weight: 900; color: var(--l700); }
  .op.letra.sil { width: auto; min-width: clamp(96px, 26vw, 150px); padding: 0 16px; }
  .opcoes.palmas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 760px; }
  .op.palmas { padding: 12px 6px; min-height: clamp(84px, 13vh, 120px); font-size: clamp(24px, 5.6vw, 34px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .op.palmas small { font-size: clamp(22px, 4vw, 34px); font-weight: 900; color: var(--l600); }
  @media (max-width: 520px) { .opcoes.palmas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .op.certa { background: #dcfce7; box-shadow: 0 6px 0 var(--verde-esc); animation: pulo .5s; }
  .op.errada { opacity: .4; animation: balanca .4s; }
  .op.apagada { opacity: .35; }
  @keyframes balanca { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .palavra-grande { font-size: clamp(50px, 13vw, 112px); font-weight: 900; letter-spacing: .08em; color: var(--l800); background: #fff; padding: 4px 26px; border-radius: 26px; box-shadow: var(--sombra); line-height: 1.15; }
  .palavra-grande .s { transition: color .2s; border-radius: 10px; }
  .palavra-grande .s.acesa { color: var(--rosa); outline: none; background: #fdf2f8; }
  .palavra-grande.sep .s + .s::before { content: '·'; color: var(--l300); margin: 0 .12em; }
  .palavra-grande.peq { font-size: clamp(34px, 8vw, 64px); }
  .frase { font-size: clamp(32px, 7.5vw, 66px); font-weight: 900; color: var(--l800); background: #fff; padding: 10px 22px; border-radius: 26px; box-shadow: var(--sombra); text-align: center; line-height: 1.2; letter-spacing: .04em; }
  .frase span { border-radius: 10px; padding: 0 .08em; }
  .frase span.acesa { color: var(--rosa); background: #fdf2f8; outline: none; }
  .b-ajuda { background: #fff; border-radius: 999px; padding: 8px 18px; font-weight: 900; color: var(--l600); box-shadow: var(--sombra); font-size: 18px; }
  .marca { color: var(--rosa); }
  .slots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .grupo { display: flex; gap: 4px; }
  .slot { min-width: clamp(58px, 14vw, 92px); height: clamp(62px, 14vw, 92px); border-radius: 18px; border: 4px dashed var(--l300); background: rgba(255, 255, 255, .6);
    font-size: clamp(30px, 8vw, 54px); font-weight: 900; display: grid; place-items: center; color: var(--l800); padding: 0 8px; }
  .letras-modo .slot { min-width: clamp(46px, 11vw, 74px); padding: 0 4px; }
  .slot.cheio { border-style: solid; background: #fff; border-color: var(--l400); }
  .slot.ok { border-color: var(--verde); background: #dcfce7; }
  .slot.mostra { border-color: var(--amarelo); background: #fffbeb; }
  .pecas { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .peca { min-width: clamp(62px, 15vw, 98px); height: clamp(62px, 15vw, 94px); padding: 0 12px; border-radius: 18px; background: var(--l200); color: var(--l800);
    font-weight: 900; font-size: clamp(30px, 8vw, 52px); box-shadow: 0 6px 0 var(--l400); }
  .peca.usada { visibility: hidden; }
  .rodape { display: flex; align-items: center; gap: 10px; min-height: 88px; }
  .mini-panda { width: 82px; height: 92px; flex: none; }
  .mini-panda svg { width: 100%; height: 100%; }
  .fala { flex: 1; background: #fff; border-radius: 22px; padding: 14px 16px; font-weight: 800; font-size: clamp(16px, 2.6vw, 22px); box-shadow: var(--sombra); min-height: 58px; line-height: 1.3; }
  .fala:empty { visibility: hidden; }
  .b-seguir { width: 86px; height: 86px; border-radius: 50%; background: var(--verde); color: #fff; font-size: 40px; box-shadow: 0 7px 0 var(--verde-esc); flex: none; animation: respira 1.4s infinite; }
  .b-seguir[hidden] { display: none; }
  @keyframes respira { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  /* ---------- letra nova ---------- */
  .intro { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .intro-corpo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 2.6vh, 24px); }
  .intro-topo { text-align: center; font-size: clamp(24px, 5vw, 40px); font-weight: 900; color: var(--rosa); letter-spacing: 1px; }
  .letrao { width: clamp(150px, 30vmin, 230px); aspect-ratio: 1; border-radius: 36px; background: linear-gradient(180deg, var(--l400), var(--l600)); color: #fff;
    font-size: clamp(110px, 24vmin, 180px); font-weight: 900; line-height: 1; box-shadow: 0 10px 0 var(--l800), 0 18px 30px rgba(70, 39, 138, .3); }
  .familia { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .exemplos { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .exemplo { background: #fff; border-radius: 22px; box-shadow: var(--sombra); padding: 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 110px; }
  .exemplo .em { font-size: clamp(44px, 9vw, 64px); line-height: 1; }
  .exemplo .pl { font-size: clamp(18px, 3.4vw, 26px); font-weight: 900; color: var(--l700); letter-spacing: .05em; }
  .exemplo .pl b { color: var(--rosa); }

  /* ---------- fim da missão ---------- */
  .fim { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .fim-titulo { margin: 0; font-size: clamp(30px, 7vw, 54px); font-weight: 900; color: var(--l700); }
  .fim .cena { width: min(70vw, 30vh, 300px); }
  .ganhos { display: flex; flex-direction: column; gap: 6px; width: min(100%, 440px); }
  .ganho { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 16px; padding: 8px 16px; font-weight: 800; box-shadow: var(--sombra); font-size: 18px; }
  .ganho b { color: var(--verde-esc); font-size: 22px; }
  .conquistas { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .letra-conq { width: 60px; height: 60px; border-radius: 16px; background: var(--l500); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 36px; box-shadow: 0 5px 0 var(--l800); }
  .fim .b-grande { max-width: 440px; }
  .fim .b-nav.largo { width: min(100%, 440px); }

  /* ---------- páginas ---------- */
  .pagina { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .trilha { display: flex; flex-direction: column; gap: 14px; position: relative; padding-left: 34px; }
  .trilha::before { content: ''; position: absolute; left: 22px; top: 30px; bottom: 30px; border-left: 6px dotted var(--l300); }
  .mundo { background: #fff; border-radius: 24px; box-shadow: var(--sombra); padding: 14px 16px; position: relative; }
  .mundo .num { position: absolute; left: -32px; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: var(--l500); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 22px; box-shadow: 0 4px 0 var(--l800); }
  .mundo.fechado { background: rgba(255, 255, 255, .55); }
  .mundo.fechado .num { background: var(--l300); box-shadow: none; }
  .mundo h3 { margin: 0 0 4px; font-size: clamp(20px, 3.6vw, 26px); font-weight: 900; color: var(--l700); }
  .mundo p { margin: 0; color: var(--suave); font-weight: 700; font-size: 16px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tile { width: clamp(46px, 10vw, 60px); height: clamp(46px, 10vw, 60px); border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: clamp(24px, 5vw, 32px);
    background: #eee9f6; color: #b8aed0; position: relative; }
  .tile.lib { background: var(--l200); color: var(--l700); }
  .tile.firme { background: var(--l500); color: #fff; box-shadow: 0 4px 0 var(--l800); }
  .tile.aprendendo { background: #fff; color: var(--l700); border: 4px solid var(--rosa); }
  .mini-emojis { font-size: 30px; margin-top: 8px; letter-spacing: 4px; }
  .grade-palavras { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .palavra-card { background: #fff; border-radius: 20px; box-shadow: var(--sombra); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .palavra-card .em { font-size: 52px; line-height: 1; }
  .palavra-card .pl { font-size: 22px; font-weight: 900; color: var(--l700); letter-spacing: .05em; }
  .vazio { background: rgba(255, 255, 255, .7); border-radius: 20px; padding: 22px; text-align: center; font-weight: 800; color: var(--suave); font-size: 18px; }
  .destaque { font-size: clamp(20px, 3.6vw, 28px); font-weight: 900; color: var(--l700); text-align: center; }

  /* ---------- roupinhas ---------- */
  .roupas-grid { display: grid; grid-template-columns: 1fr; gap: 12px; --cena-w: min(calc(100vw - 28px), 34vh, 380px); }
  /* o panda e a barra de comprar ficam grudados no alto; as abas grudam logo embaixo */
  .vitrine { position: sticky; top: 6px; z-index: 4; width: var(--cena-w); margin: 0 auto; }
  .vitrine .cena { width: 100%; }
  .compra.folha { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(calc(100vw - 24px), 520px); z-index: 20;
    box-shadow: 0 10px 30px rgba(70, 39, 138, .35); border: 3px solid var(--amarelo); animation: sobeFolha .25s ease-out; }
  @keyframes sobeFolha { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  .compra.folha .b-grande { white-space: nowrap; font-size: clamp(18px, 4.6vw, 26px); }
  .loja.com-folha { padding-bottom: 150px; }
  .loja .abas { position: sticky; top: calc(var(--cena-w) * 1.1 + 12px); z-index: 3; background: var(--l100); padding: 6px; border-radius: 18px; }
  @media (min-width: 760px) and (orientation: landscape) {
    .roupas-grid { grid-template-columns: 1fr 1.2fr; align-items: start; --cena-w: min(100%, 72vh, 440px); }
    .loja .abas { top: 6px; }
  }
  .loja { display: flex; flex-direction: column; gap: 10px; }
  .abas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .aba { background: rgba(255, 255, 255, .7); border-radius: 16px; font-size: clamp(26px, 5vw, 34px); padding: 8px 0; }
  .aba.ativa { background: #fff; box-shadow: var(--sombra); outline: 4px solid var(--l400); }
  .itens { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .item { background: #fff; border-radius: 20px; box-shadow: var(--sombra); padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .item svg { width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; background: var(--l50); }
  .item .preco { font-weight: 900; font-size: 18px; color: var(--l700); }
  .item.caro { opacity: .5; }
  .item.vestindo { outline: 5px solid var(--verde); }
  .item.provando { outline: 5px solid var(--amarelo); }
  .item .selo { position: absolute; top: -8px; right: -6px; background: var(--verde); color: #fff; border-radius: 999px; padding: 2px 8px; font-weight: 900; font-size: 14px; }
  .compra { display: flex; flex-direction: column; gap: 8px; background: #fff; border-radius: 22px; padding: 10px; box-shadow: var(--sombra); }
  .compra-nome { font-weight: 900; color: var(--l800); font-size: clamp(20px, 3.6vw, 26px); letter-spacing: .05em; text-align: center; }
  .compra-linha { display: flex; gap: 10px; align-items: center; }
  .compra .b-grande { min-height: 64px; font-size: clamp(20px, 4vw, 28px); }
  .compra .b-x { width: 64px; height: 64px; }
  .panda-svg .amigo { animation: saltita 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes saltita { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9%); } }

<script id="logica">

  function letrasDe(s) {
    const out = [];
    for (let i = 0; i < s.length; i++) {
      const m = RE_SIL.exec(s[i]);
      if (!m) return null;
      const c = m[1], v = base(m[2]);
      if ((c === 'C' || c === 'G') && (v === 'E' || v === 'I')) return null; // CE, CI, GE, GI: outro som

      if (c && !out.includes(c)) out.push(c);

  const VB_SLOT = { cabeca: '28 -56 144 102', olhos: '40 56 120 56', pescoco: '38 110 124 82', corpo: '18 108 164 120', sapatos: '36 166 128 58', mao: '112 80 92 130', cor: '24 14 152 112' };

  // ===================== MISSÃO =====================
  let respondido = false;
  function renderMissao() {
    const m = estado.missaoAtiva;

  const enunciado = t => { $('#enunciado').textContent = t; };

  function ouvir(fn) { $('#b-ouvir').onclick = () => { pop(); fn(); }; setTimeout(() => { if (!respondido) fn(); }, 250); }
  function ligarOpcoes(m, q) {
    const escolher = i => {

  const silSpans = (w, sep) => w.s.map((s, i) => `<span class="s" data-s="${i}">${s}</span>`).join('');

  const cartaoFig = (w, extra) => `<button class="cartao figura ${extra || ''}" id="fig" aria-label="${esc(w.p)}">${w.e}</button>`;

  const RENDER = {
    silabas(m, q) {

    silaba(m, q) {
      const vogal = J.VOGAIS.includes(q.alvo);

      $('#fig').onclick = () => Voz.seq([{ t: J.falaSilaba(q.alvo), rate: 0.85 }]);

      const w = P(q.palavra), ops = q.opcoes.map(P);
      enunciado('Leia e toque na figura');
      estimulo(`<div class="palavra-grande" id="pal">${silSpans(w)}</div><button class="b-ajuda" id="b-ajuda">🔊 ajuda</button>`);
      opcoes(ops.map((o, i) => `<button class="op fig" data-i="${i}" aria-label="${esc(o.p)}">${o.e}</button>`).join(''));
      $('#b-ajuda').onclick = () => { if (respondido) return; q.ajuda = true; salvar(); Voz.seq([...w.s.map((s, i) => ({ t: J.falaSilaba(s), antes: () => acenderSil(i), pausa: 380, rate: 0.8 })), { antes: () => acenderSil(-1), pausa: 0 }]); };
      ligarOpcoes(m, q);
      ouvir(() => Voz.seq([{ t: 'Leia a palavra e toque na figura certa.' }, { t: 'É', pausa: 60 }, ...falaOpcoes(ops), { antes: () => acender(null), pausa: 0 }]));
    },
    montar(m, q) { RENDER._montagem(m, q, false); },
    letras(m, q) { RENDER._montagem(m, q, true); },
    _montagem(m, q, porLetra) {
      const w = P(q.palavra), n = q.resposta.length;
      enunciado(porLetra ? 'Escreva com as letrinhas' : 'Monte a palavra');
      let slots = '';
      if (porLetra) { let k = 0; slots = q.grupos.map(g => `<div class="grupo">${Array.from({ length: g }, () => `<div class="slot" data-s="${k++}"></div>`).join('')}</div>`).join(''); }
      else slots = q.resposta.map((_, i) => `<div class="slot" data-s="${i}"></div>`).join('');
      estimulo(`${cartaoFig(w, 'media')}<div class="slots ${porLetra ? 'letras-modo' : ''}" id="slots">${slots}</div>`);
      opcoes(q.pecas.map((p, i) => `<button class="peca" data-p="${i}">${p}</button>`).join(''), 'pecas');
      const cheio = Array(n).fill(null);
      const pintar = () => {
        $$('#slots .slot').forEach((s, i) => { s.textContent = cheio[i] === null ? '' : q.pecas[cheio[i]]; s.classList.toggle('cheio', cheio[i] !== null); });
        $$('#opcoes .peca').forEach((b, i) => b.classList.toggle('usada', cheio.includes(i)));
      };
      const conferir = () => {
        if (respondido || cheio.includes(null)) return;
        const seqv = cheio.map(i => q.pecas[i]), certo = J.verificarMontagem(q, seqv);
        $$('#slots .slot').forEach((s, i) => { if (certo) s.classList.add('ok'); else { s.textContent = q.resposta[i]; s.classList.add('mostra'); } });
        responder(m, q, certo);
      };
      const colocar = i => { if (respondido || cheio.includes(i)) return; const vaga = cheio.indexOf(null); if (vaga < 0) return; cheio[vaga] = i; pop(); pintar(); Voz.seq([{ t: porLetra ? letraFala(q.pecas[i]) : J.falaSilaba(q.pecas[i]), pausa: 0 }]); setTimeout(conferir, 350); };
      const tirar = k => { if (respondido || cheio[k] === null) return; cheio[k] = null; pintar(); };
      $$('#opcoes .peca').forEach(b => { b.onclick = () => colocar(Number(b.dataset.p)); });
      $$('#slots .slot').forEach(s => { s.onclick = () => tirar(Number(s.dataset.s)); });
      $('#fig').onclick = () => Voz.seq([{ t: fp(w) }]);
      teclas = {
        letra: L => { const i = q.pecas.findIndex((p, k) => !cheio.includes(k) && (p === L || J.semAcento(p) === L || p[0] === L)); if (i >= 0) colocar(i); },
        apagar: () => { for (let k = n - 1; k >= 0; k--) if (cheio[k] !== null) { tirar(k); break; } },
      };
      pintar();
      ouvir(() => Voz.seq([{ t: porLetra ? `Escreva ${fp(w)} com as letrinhas.` : `Monte a palavra ${fp(w)}.` }]));
    },
    frase(m, q) {
      enunciado('Leia a frase');
      estimulo(`<div class="frase" id="frase">${q.texto.split(' ').map((p, i) => `<span data-w="${i}">${p}</span>`).join(' ')}</div><button class="b-ajuda" id="b-ajuda">🔊 ajuda</button>`);
      opcoes(q.opcoes.map((par, i) => `<button class="op fig dupla ${q.modelo === 'lugar' ? 'empilha' : ''}" data-i="${i}" aria-label="${esc(par.join(' e '))}">${P(par[0]).e}<span>${P(par[1]).e}</span></button>`).join(''));
      const palavras = q.texto.replace('.', '').split(' ');
      $('#b-ajuda').onclick = () => { if (respondido) return; q.ajuda = true; salvar(); Voz.seq([...palavras.map((p, i) => ({ t: fp(p), antes: () => acender(`#frase [data-w="${i}"]`), pausa: 300, rate: 0.85 })), { antes: () => acender(null), pausa: 0 }]); };
      ligarOpcoes(m, q);
      ouvir(() => Voz.seq([{ t: 'Leia a frase e toque na figura certa.' }]));
    },
  };
  const letraFala = l => J.ehVogal(l) ? J.falaSilaba(l) : J.falaLetra(J.base(l));

  function responder(m, q, certo) {
    if (respondido) return;
    respondido = true; teclas = null;
    Voz.calar();
    const desc = m.tipo === 'descoberta';
    J.registrar(estado, m, { acertou: certo, ajuda: q.ajuda }, hoje(), rng);
    salvar();
    const mp = $('#mini-panda');
    mp.innerHTML = pandaSVG(veste(), certo ? 'uau' : 'pensa');
    mp.classList.remove('pula', 'inclina'); void mp.offsetWidth; mp.classList.add(certo ? 'pula' : 'inclina');
    if (certo) plim();
    const ex = desc ? explicaDescoberta(q, certo) : explicacao(q, certo);
    $('#fala').innerHTML = ex.html;
    if (ex.revelar) ex.revelar();
    const b = $('#b-seguir');
    b.hidden = false;
    const seguir = () => { Voz.calar(); render(); };
    b.onclick = seguir;
    teclas = { ok: seguir };
    $('#b-ouvir').onclick = () => Voz.seq(ex.fala);
    Voz.seq(ex.fala);
  }
  const ELOGIOS = ['Isso!', 'Muito bem!', 'Acertou!', 'Boa, {n}!', 'Que demais!', 'Arrasou!'];
  const QUASE = ['Quase! Olha só:', 'Hmm, olha de novo:', 'Vamos ver juntos:'];
  const marcaInicio = (w, n) => `<b class="marca">${w.p.slice(0, n)}</b>${w.p.slice(n)}`;
  // na correção a figura fica e a palavra escrita aparece embaixo
  function revelarComFigura(w, palavraHTML, classe) {
    estimulo(`${cartaoFig(w, 'media')}<div class="palavra-grande peq ${classe || ''}">${palavraHTML}</div>`);
    $('#fig').onclick = () => Voz.seq([{ t: fp(w) }]);
  }
  function explicacao(q, certo) {
    const ab = certo ? sorteia(ELOGIOS).replace('{n}', nome()) : sorteia(QUASE);
    const fala = [{ t: ab }];
    switch (q.tipo) {
      case 'silabas': {
        const w = P(q.palavra), n = w.s.length;
        return {
          html: `${esc(ab)} <b>${w.s.join(' · ')}</b> = ${n} ${n === 1 ? 'pedacinho' : 'pedacinhos'}`,
          revelar: () => revelarComFigura(w, silSpans(w), 'sep'),
          fala: fala.concat(w.s.map((s, i) => ({ t: J.falaSilaba(s), antes: () => acenderSil(i), pausa: 260 })), [{ antes: () => acenderSil(-1), t: `${fp(w)} tem ${J.NUM[n]} ${n === 1 ? 'pedacinho' : 'pedacinhos'}!` }]),
        };
      }
      case 'comeca': {
        const w = P(q.palavra), o = P(q.opcoes[q.correta]), n = w.s[0].length;
        return { html: `${esc(ab)} ${marcaInicio(w, n)} e ${marcaInicio(o, n)} começam com <b>${w.s[0]}</b>`, fala: fala.concat([{ t: `${fp(w)} e ${fp(o)} começam com ${J.falaSilaba(w.s[0])}.` }]) };
      }
      case 'rima': {
        const w = P(q.palavra), o = P(q.opcoes[q.correta]);
        const fim = x => `${x.p.slice(0, x.p.length - w.rima.length)}<b class="marca">${x.p.slice(x.p.length - w.rima.length)}</b>`;
        return { html: `${esc(ab)} ${fim(w)} e ${fim(o)} rimam!`, fala: fala.concat([{ t: `${fp(w)}, ${fp(o)}: rimam!` }]) };
      }
      case 'letra': {
        const w = P(q.palavra);
        const som = Gravacoes.url('som:' + q.foco);
        return {
          html: `${esc(ab)} ${marcaInicio(w, 1)} começa com <b>${q.foco}</b>`,
          revelar: () => revelarComFigura(w, marcaInicio(w, 1)),
          fala: fala.concat([{ t: `${fp(w)} começa com ${J.falaLetra(q.foco)}.` }], som ? [{ audio: som }] : []),
        };
      }
      case 'silaba': {
        const vogal = J.VOGAIS.includes(q.alvo);
        return {
          html: vogal ? `${esc(ab)} Esta é a letra <b>${q.alvo}</b>` : `${esc(ab)} <b>${q.alvo[0]}</b> + <b>${q.alvo.slice(1)}</b> = <b class="marca">${q.alvo}</b>`,
          fala: fala.concat(vogal ? [{ t: J.falaSilaba(q.alvo) }] : [{ t: `${J.falaLetra(q.alvo[0])} com ${J.falaSilaba(q.alvo.slice(1))}:` }, { t: J.falaSilaba(q.alvo), rate: 0.85 }]),
        };
      }
      case 'ler': case 'montar': case 'letras': {
        const w = P(q.palavra);
        return {
          html: `${esc(ab)} <b>${w.p}</b> ${w.e}`,
          revelar: () => { const pal = $('#pal'); if (pal) pal.classList.add('sep'); },
          fala: fala.concat(q.tipo === 'ler' ? w.s.map((s, i) => ({ t: J.falaSilaba(s), antes: () => acenderSil(i), pausa: 200, rate: 0.85 })) : [], [{ antes: () => acenderSil(-1), t: `${fp(w)}!` }]),
        };
      }
      case 'frase': {
        const palavras = q.texto.replace('.', '').split(' ');
        return {
          html: `${esc(ab)} <b>${esc(q.texto)}</b>`,
          fala: fala.concat(palavras.map((p, i) => ({ t: fp(p), antes: () => acender(`#frase [data-w="${i}"]`), pausa: 140 })), [{ antes: () => acender(null), pausa: 0 }]),
        };
      }
    }
    return { html: esc(ab), fala };
  }
  function explicaDescoberta(q, certo) {
    const w = P(q.palavra);
    return certo
      ? { html: `Você já conhece o <b>${q.foco}</b>! ${marcaInicio(w, 1)}`, revelar: () => revelarComFigura(w, marcaInicio(w, 1)), fala: [{ t: `Isso! Você já conhece o ${J.falaLetra(q.foco)}!` }] }
      : { html: `Tudo bem! ${marcaInicio(w, 1)} começa com <b>${q.foco}</b>. Essa a gente aprende juntos.`, revelar: () => revelarComFigura(w, marcaInicio(w, 1)), fala: [{ t: `Tudo bem! ${fp(w)} começa com ${J.falaLetra(q.foco)}. Essa a gente aprende juntos.` }] };
  }

  // ---------- apresentação da letra (nova, relembrar ou rever pela trilha) ----------
  function renderIntro(L, tipo, aoFim) {
    const vogal = J.VOGAIS.includes(L), nomeL = J.falaLetra(L);
    const fam = J.familia(L), exs = J.exemplos(L, J.liberadas(estado), 3);
    const titulo = tipo === 'nova' ? 'LETRA NOVA!' : tipo === 'reforco' ? 'VAMOS RELEMBRAR?' : `A LETRA ${L}`;
    palco.innerHTML = `
      <div class="intro">
        ${tipo === 'revisao' ? `<div class="barra"><button class="b-x" id="b-voltar" aria-label="Voltar">✕</button></div>` : ''}
        <div class="intro-topo">${titulo}</div>
        <div class="intro-corpo">
          <button class="letrao" id="letrao" aria-label="letra ${L}">${L}</button>
          ${vogal ? '' : `<div class="familia">${fam.map((s, i) => `<button class="peca" data-f="${i}">${s}</button>`).join('')}</div>`}
          <div class="exemplos">${exs.map((w, i) => `<button class="exemplo" data-x="${i}"><span class="em">${w.e}</span><span class="pl">${marcaInicio(w, 1)}</span></button>`).join('')}</div>
        </div>
        <div class="rodape"><div class="mini-panda">${pandaSVG(veste(), 'feliz')}</div><div class="fala" id="fala">${vogal ? `Esta é a vogal <b>${L}</b>.` : `Esta é a letra <b>${L}</b>.`}</div><button class="b-seguir" id="b-seguir" aria-label="Vamos brincar">▶</button></div>
      </div>`;
    const som = Gravacoes.url('som:' + L);
    const falaLetra = () => [
      { t: vogal ? `Esta é a vogal ${nomeL}.` : `Esta é a letra ${nomeL}.`, antes: () => acender('#letrao') },
      som ? { t: 'Ela faz assim:', pausa: 80 } : null, som ? { audio: som } : null,
    ];
    const tudo = () => Voz.seq([
      { t: tipo === 'nova' ? 'Letra nova!' : tipo === 'reforco' ? 'Vamos relembrar!' : '', pausa: 150 },
      ...falaLetra(),
      ...(vogal ? [] : [{ t: 'Com as vogais, ela faz:', antes: () => acender(null) }, ...fam.map((s, i) => ({ t: J.falaSilaba(s), antes: () => acender(`[data-f="${i}"]`), pausa: 220, rate: 0.85 }))]),
      exs[0] ? { t: `${nomeL} de ${fp(exs[0])}.`, antes: () => acender('[data-x="0"]') } : null,
      ...exs.slice(1).map((w, i) => ({ t: fp(w), antes: () => acender(`[data-x="${i + 1}"]`) })),
      { antes: () => acender(null), pausa: 0 },
    ]);
    $('#letrao').onclick = () => Voz.seq(falaLetra());
    $$('[data-f]').forEach(b => { b.onclick = () => { pop(); Voz.seq([{ t: J.falaSilaba(fam[Number(b.dataset.f)]), rate: 0.85 }]); }; });
    $$('[data-x]').forEach(b => { b.onclick = () => Voz.seq([{ t: fp(exs[Number(b.dataset.x)]) }]); });
    const fim = () => { Voz.calar(); aoFim(); };
    $('#b-seguir').onclick = fim;
    if ($('#b-voltar')) $('#b-voltar').onclick = fim;
    teclas = { ok: fim };
    setTimeout(tudo, 200);
  }

  function concluirMissao(m) {
    const desc = m.tipo === 'descoberta';
    const res = J.finalizarMissao(estado, m, hoje(), horaAgora());
    salvar();
    const podeComprar = J.ITENS.some(it => it.preco > 0 && !estado.roupas.tem.includes(it.id) && it.preco <= estado.bambus);
    const titulo = desc ? 'DESCOBERTA FEITA!' : 'MISSÃO CUMPRIDA!';
    palco.innerHTML = `
      <div class="fim">
        <h1 class="fim-titulo">${titulo}</h1>
        <div class="cena dancando">${cenaHTML(veste(), 'uau')}</div>
        ${res.conquistas.length ? `<div class="destaque">${desc ? 'Letras que você já conhece:' : res.conquistas.length > 1 ? 'Letras firmes:' : 'Letra firme:'}</div><div class="conquistas">${res.conquistas.map(l => `<span class="letra-conq">${l}</span>`).join('')}</div>` : ''}
        <div class="ganhos">${res.ganhos.filter(g => g.n > 0).map(g => `<div class="ganho"><span>${esc(g.rotulo)}</span><b>+${g.n} 🎋</b></div>`).join('')}</div>
        <button class="b-grande verde" id="b-casa">🏠 VOLTAR</button>
        ${podeComprar ? `<button class="b-nav largo" data-ir="roupas">👗 Já dá para comprar uma roupinha!</button>` : ''}
      </div>`;
    confete(); festa();
    const voltar = () => ir('casa');
    $('#b-casa').onclick = voltar;
    teclas = { ok: voltar };
    const n = res.conquistas.length;
    const falas = desc
      ? [{ t: n ? `Uau! Você já conhece ${n === 1 ? 'uma letra' : J.NUM[n] && n <= 5 ? J.NUM[n] + ' letras' : n + ' letras'}!` : 'Agora vamos aprender as letras juntos!' }, { t: `Você ganhou ${res.total} bambus!` }]
      : [{ t: `Missão cumprida! Você ganhou ${res.total} bambus!` }, n ? { t: n > 1 ? 'E ficou craque em letras novas!' : `E ficou craque na letra ${J.falaLetra(res.conquistas[0])}!` } : null, podeComprar ? { t: `Já dá para comprar uma roupinha para o ${amigo()}!` } : null];
    setTimeout(() => Voz.seq(falas), 300);
  }

  // ===================== TRILHA =====================
  function renderTrilha() {
    const ab = J.mundosAbertos(estado), lib = J.liberadas(estado), dec = J.decodaveis(lib);
    const lidas = Object.keys(estado.palavras).filter(p => estado.palavras[p].lidas > 0).length;
    const estadoLetra = l => { const s = estado.letras[l]; return !s.lib ? '' : s.dominada ? 'lib firme' : 'lib aprendendo'; };
    const corpo = mu => {
      if (mu.n === 2) return `<div class="tiles">${J.SEQ.map(l => `<button class="tile ${estadoLetra(l)}" data-l="${l}" aria-label="letra ${l}">${l}</button>`).join('')}</div>`;
      if (mu.n === 3 && ab[3]) return `<p>${dec.length} palavras para ler · já leu ${lidas}</p><div class="mini-emojis">${dec.slice(0, 12).map(w => w.e).join('')}</div>`;
      return '';
    };
    palco.innerHTML = `
      <div class="pagina">
        <div class="barra"><button class="b-x" data-ir="casa" aria-label="Voltar">✕</button><h2>🗺️ TRILHA</h2></div>
        <div class="trilha">${J.MUNDOS.map(mu => `
          <div class="mundo ${ab[mu.n] ? '' : 'fechado'}">
            <div class="num">${ab[mu.n] ? mu.n : '🔒'}</div>
            <h3>${mu.icone} ${mu.nome.toUpperCase()}</h3>
            <p>${ab[mu.n] ? esc(mu.descr) : esc(mu.requisito)}</p>
            ${corpo(mu)}
          </div>`).join('')}
        </div>
      </div>`;
    $$('.tile[data-l]').forEach(b => {
      b.onclick = () => {
        const l = b.dataset.l;
        if (!estado.letras[l].lib) { Voz.seq([{ t: 'Essa letra ainda vai chegar!' }]); return; }
        renderIntro(l, 'revisao', () => render());
      };
    });
    Voz.seq([{ t: `Você já conhece ${lib.size} letras!` }]);
  }

  // ===================== PALAVRAS =====================
  function renderPalavras() {
    const lidas = Object.keys(estado.palavras).filter(p => estado.palavras[p].lidas > 0 && P(p)).sort();
    palco.innerHTML = `
      <div class="pagina">
        <div class="barra"><button class="b-x" data-ir="casa" aria-label="Voltar">✕</button><h2>📖 MINHAS PALAVRAS</h2></div>
        <div class="destaque">${lidas.length ? `${esc(nome().toUpperCase())} JÁ LEU ${lidas.length} ${lidas.length === 1 ? 'PALAVRA' : 'PALAVRAS'}!` : ''}</div>
        ${lidas.length ? `<div class="grade-palavras">${lidas.map(p => `<button class="palavra-card" data-p="${esc(p)}"><span class="em">${P(p).e}</span><span class="pl">${p}</span></button>`).join('')}</div>`
        : `<div class="vazio">As palavras que você ler sozinha aparecem aqui!</div>`}
      </div>`;
    $$('.palavra-card').forEach(b => { b.onclick = () => Voz.seq([{ t: fp(b.dataset.p) }]); });
    Voz.seq([{ t: lidas.length ? `Você já leu ${lidas.length} ${lidas.length === 1 ? 'palavra' : 'palavras'}!` : 'As palavras que você ler aparecem aqui!' }]);
  }

  // ===================== ROUPINHAS =====================
  let slotAtual = 'cabeca', provando = null, comendo = false, apagandoFoto = null;
  const ABAS = J.SLOTS.concat([{ id: 'lanche', nome: 'Lanchinho', icone: '🍎' }, { id: 'fotos', nome: 'Fotos', icone: '📸' }]);
  const nham = () => nota([440, 554.4, 659.3], 0.09, 0.18, 0.1);
  const clique = () => nota([1318.5, 1760], 0.04, 0.06, 0.1);
  function flash() { const f = $('#flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on'))); }
  function lojaItens() {
    const card = it => {
      const tem = estado.roupas.tem.includes(it.id), usando = veste()[it.slot] === it.id;
      const cls = ['item', tem ? '' : estado.bambus < it.preco ? 'caro' : '', usando ? 'vestindo' : '', provando === it.id ? 'provando' : ''].join(' ');
      return `<button class="${cls}" data-item="${it.id}" aria-label="${esc(it.nome)}">${previaItem(it)}<span class="preco">${tem ? (usando ? '✓' : '') : `${it.preco} 🎋`}</span>${usando && !J.FIXOS.includes(it.slot) ? '<span class="selo">usando</span>' : ''}</button>`;
    };
    return `<div class="itens">${J.ITENS.filter(it => it.slot === slotAtual).map(card).join('')}</div>`;
  }
  function lojaLanche() {
    const n = J.lanchesHoje(estado, hoje());
    return `<div class="lanche-info">${esc(amigo())} comeu: ${Array.from({ length: J.LANCHE_MAX }, (_, i) => `<span class="prato ${i < n ? '' : 'sem'}">🍽️</span>`).join('')}</div>
      <div class="itens">${J.LANCHES.map(l => `<button class="item lanche ${estado.bambus < l.preco || n >= J.LANCHE_MAX ? 'caro' : ''}" data-lanche="${l.id}" aria-label="${esc(l.nome)}"><span class="em">${l.emoji}</span><span class="nome">${l.nome}</span><span class="preco">${l.preco} 🎋</span></button>`).join('')}</div>`;
  }
  function lojaFotos() {
    const fotos = estado.roupas.fotos;
    const lista = fotos.map((f, i) => ({ f, i })).reverse();
    return `<button class="b-grande verde" id="b-foto">📸 TIRAR FOTO</button>
      ${fotos.length ? `<div class="fotos">${lista.map(({ f, i }) => `<div class="foto"><button class="cena" data-foto="${i}" aria-label="foto ${i + 1}">${cenaHTML(Object.assign({}, J.VESTE_PADRAO, f.veste), 'feliz')}</button><button class="foto-x ${apagandoFoto === i ? 'confirma' : ''}" data-apagar-foto="${i}" aria-label="apagar foto">${apagandoFoto === i ? 'APAGAR?' : '✕'}</button></div>`).join('')}</div>`
      : `<div class="vazio">Vista o ${esc(amigo())} e tire uma foto!</div>`}`;
  }
  function renderRoupas() {
    const vs = Object.assign({}, veste());
    if (provando) vs[J.ITEM[provando].slot] = provando;
    const itP = provando && J.ITEM[provando], podeP = itP && estado.bambus >= itP.preco;
    const corpo = slotAtual === 'lanche' ? lojaLanche() : slotAtual === 'fotos' ? lojaFotos() : lojaItens();
    palco.innerHTML = `
      <div class="pagina">
        <div class="barra"><button class="b-x" data-ir="casa" aria-label="Voltar">✕</button><h2>👗 ROUPINHAS</h2><div class="contador" id="contador">🎋 ${estado.bambus}</div></div>
        <div class="roupas-grid">
          <div class="vitrine"><div class="cena" id="cena">${cenaHTML(vs, 'feliz')}</div></div>
          <div class="loja ${itP ? 'com-folha' : ''}">
            <div class="abas">${ABAS.map(s => `<button class="aba ${s.id === slotAtual ? 'ativa' : ''}" data-slot="${s.id}" aria-label="${s.nome}">${s.icone}</button>`).join('')}</div>
            ${corpo}
          </div>
        </div>
        ${itP ? `<div class="compra folha"><div class="compra-nome">${esc(itP.nome.toUpperCase())}</div><div class="compra-linha"><button class="b-grande ${podeP ? 'verde' : ''}" id="b-comprar" ${podeP ? '' : 'disabled'}>${podeP ? `COMPRAR · ${itP.preco} 🎋` : `FALTAM ${itP.preco - estado.bambus} 🎋`}</button><button class="b-x" id="b-desistir" aria-label="Não comprar">✕</button></div></div>` : ''}
      </div>`;
    $$('.aba').forEach(b => {
      b.onclick = () => {
        pop(); slotAtual = b.dataset.slot; provando = null; apagandoFoto = null; renderRoupas();
        const aba = ABAS.find(a => a.id === slotAtual);
        Voz.seq([{ t: slotAtual === 'amigo' ? `Amiguinhos do ${amigo()}!` : aba.nome + '!' }]);
      };
    });
    $$('[data-item]').forEach(b => {
      b.onclick = () => {
        const id = b.dataset.item, it = J.ITEM[id];
        if (estado.roupas.tem.includes(id)) {
          provando = null; const tirou = veste()[it.slot] === id && !J.FIXOS.includes(it.slot);
          J.vestir(estado, id); salvar(); pop(); renderRoupas();
          if (!tirou) Voz.seq([{ t: it.nome + '!' }]);
          return;
        }
        provando = provando === id ? null : id;
        renderRoupas();
        if (provando) Voz.seq([{ t: estado.bambus >= it.preco ? `${it.nome}! Quer comprar por ${it.preco} bambus?` : `${it.nome}. Faltam ${it.preco - estado.bambus} bambus. Vamos fazer mais missões!` }]);
      };
    });
    if ($('#b-comprar')) $('#b-comprar').onclick = () => {
      if (!J.comprar(estado, provando)) return;
      provando = null; salvar(); festa(); confete(); renderRoupas();
      Voz.seq([{ t: sorteia(['Ficou lindo!', 'Que chique!', 'Adorei!', 'Uau, que demais!']) }]);
    };
    if ($('#b-desistir')) $('#b-desistir').onclick = () => { provando = null; renderRoupas(); };
    $$('[data-lanche]').forEach(b => {
      b.onclick = () => {
        if (comendo) return;
        const l = J.LANCHES.find(x => x.id === b.dataset.lanche);
        const r = J.darLanche(estado, l.id, hoje());
        if (!r.ok) {
          Voz.seq([{ t: r.motivo === 'cheio' ? `Estou cheio! Amanhã tem mais lanchinho.` : `Faltam ${r.falta} ${r.falta === 1 ? 'bambu' : 'bambus'}.` }]);
          return;
        }
        salvar(); comendo = true;
        $('#contador').textContent = '🎋 ' + estado.bambus;
        Voz.seq([{ t: `Hmm! Que delícia de ${fp(l.nome)}!`, pausa: 200 }, r.restam === 0 ? { t: 'Agora estou cheio!' } : null]);
        comerAnim(l, b).then(() => { comendo = false; if (rotaAtual() === 'roupas' && slotAtual === 'lanche') renderRoupas(); });
      };
    });
    if ($('#b-foto')) $('#b-foto').onclick = () => {
      J.tirarFoto(estado, hoje()); salvar(); flash(); clique(); apagandoFoto = null; renderRoupas();
      Voz.seq([{ t: sorteia(['Que foto linda!', 'Xiiis! Ficou ótima!', 'Foto guardada no álbum!']) }]);
    };
    $$('[data-foto]').forEach(b => {
      b.onclick = () => { apagandoFoto = null; J.vestirFoto(estado, Number(b.dataset.foto)); salvar(); pop(); renderRoupas(); Voz.seq([{ t: 'Prontinho! Igual à foto.' }]); };
    });
    $$('[data-apagar-foto]').forEach(b => {
      b.onclick = () => {
        const i = Number(b.dataset.apagarFoto);
        if (apagandoFoto === i) { J.apagarFoto(estado, i); apagandoFoto = null; salvar(); }
        else apagandoFoto = i;
        renderRoupas();
      };
    });
  }
  // a comida voa até a boca do panda, ele faz "uau", a palavra aparece escrita e sobem coraçõezinhos
  function comerAnim(l, botao) {
    return new Promise(res => {
      const cena = $('#cena');
      if (!cena) return res();
      const rc = cena.getBoundingClientRect(), rb = botao.getBoundingClientRect();
      const x0 = rb.left + rb.width / 2, y0 = rb.top + rb.height / 2;
      const voo = document.createElement('div');
      voo.className = 'voo'; voo.textContent = l.emoji; voo.style.left = x0 + 'px'; voo.style.top = y0 + 'px';
      document.body.appendChild(voo);
      const dx = rc.left + rc.width * 0.5 - x0, dy = rc.top + rc.height * 0.58 - y0;
      requestAnimationFrame(() => requestAnimationFrame(() => { voo.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px) scale(.35)`; }));
      setTimeout(() => {
        voo.remove();
        if (!document.body.contains(cena)) return;
        cena.innerHTML = cenaHTML(veste(), 'uau') + `<div class="palavra-cena">${esc(l.nome)}</div>`;
        nham();
        for (let i = 0; i < 6; i++) {
          const c = document.createElement('span');
          c.className = 'coracao-voa'; c.textContent = i % 2 ? '💜' : '💗';
          c.style.left = (28 + Math.random() * 44) + '%'; c.style.top = (46 + Math.random() * 14) + '%'; c.style.animationDelay = (i * 0.12) + 's';
          cena.appendChild(c);
        }
      }, 650);
      setTimeout(res, 2100);
    });
  }

  // ===================== PAINEL DO PAPAI =====================
  let letraSel = null;
  const dataTxt = n => { const d = new Date(n * 86400000); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
  function renderPainel() {
    const lib = J.liberadas(estado), dec = J.decodaveis(lib), ab = J.mundosAbertos(estado), dia = estado.dia;
    const prox = J.proximaLetra(estado), aprend = J.aprendendo(estado);
    const lidas = Object.keys(estado.palavras).filter(p => estado.palavras[p].lidas > 0);
    const hist = estado.historico.slice(-14).reverse();
    const fracas = J.letrasFracas(estado, 6), pfracas = J.palavrasFracas(estado, 8);
    const hj = estado.historico.find(h => h.dia === hoje());
    const naoLidas = dec.filter(w => !(estado.palavras[w.p] && estado.palavras[w.p].lidas > 0));
    const st = l => { const s = estado.letras[l]; return !s.lib ? '' : s.dominada ? 'lib firme' : 'lib aprendendo'; };
    const vozes = Voz.listar();
    const sel = letraSel && estado.letras[letraSel];
    palco.innerHTML = `
      <div class="pagina painel">
        <div class="barra"><button class="b-x" id="b-fechar" aria-label="Fechar">✕</button><h2>Painel do papai</h2></div>
        <section class="card">
          <h3>Hoje (${dataTxt(hoje())})</h3>
          <div class="nums">
            <div class="num"><b>${dia.missoes.filter(m => m.feita).length}/${dia.missoes.length}</b>missões${dia.extras ? ` + ${dia.extras} extra` : ''}</div>
            <div class="num"><b>${hj ? Math.round(100 * hj.dePrimeira / Math.max(1, hj.perguntas)) + '%' : '—'}</b>de primeira (${hj ? hj.perguntas : 0} perguntas)</div>
            <div class="num"><b>${lib.size}/${J.SEQ.length}</b>letras liberadas</div>
            <div class="num"><b>${lidas.length}</b>palavras já lidas sozinha</div>
            <div class="num"><b>${dec.length}</b>palavras possíveis com essas letras</div>
            <div class="num"><b>${estado.dias.length}</b>dias jogados</div>
          </div>
          ${dia.revisar.length ? `<p><b>Para rever hoje no papel</b> (o que ela errou antes de acertar):</p><ul>${dia.revisar.slice(-12).map(r => `<li>${esc(r.texto)}${r.tentativas > 2 ? ` — ${r.tentativas} tentativas` : ''}</li>`).join('')}</ul>` : '<p>Nada para rever hoje.</p>'}
        </section>
        <section class="card">
          <h3>Letras</h3>
          <div class="legenda"><span style="background:var(--l500)"></span>firme <span style="background:#fff;border:3px solid var(--rosa)"></span>aprendendo <span style="background:#eee9f6"></span>ainda não chegou</div>
          <div class="tiles">${J.SEQ.map(l => { const s = estado.letras[l]; return `<button class="tile ${st(l)}" data-l="${l}">${l}${s.lib ? `<small>${s.acertos}✓${s.erros ? ' ' + s.erros + '✗' : ''}</small>` : ''}</button>`; }).join('')}</div>
          <p>${aprend.length ? `Aprendendo agora: <b>${aprend.join(', ')}</b> — fica firme com ${J.DOMINIO} acertos de primeira seguidos.` : prox ? `Próxima letra: <b>${prox}</b> (entra na próxima missão, até ${estado.config.novasPorDia} por dia).` : 'Todas as letras desta etapa já chegaram.'}
          ${estado.descoberta.feita ? ` Na descoberta ela já conhecia: <b>${(estado.descoberta.conhecidas || []).join(', ') || 'nenhuma'}</b>.` : ''}</p>
          ${sel ? `<div class="acoes"><b style="align-self:center">Letra ${letraSel}:</b>
            ${sel.lib ? `<button class="bt" data-acao="rever">Rever a apresentação</button>` : ''}
            ${!sel.dominada ? `<button class="bt forte" data-acao="conhecida">Marcar como firme</button>` : ''}
            ${sel.lib ? `<button class="bt perigo" data-acao="bloquear">Tirar (volta a ser nova)</button>` : ''}
            <button class="bt" data-acao="fechar-letra">Fechar</button></div>` : '<p style="color:var(--suave)">Toque numa letra para marcar como firme, rever a apresentação ou tirar.</p>'}
        </section>
        <section class="card">
          <h3>Para treinar no papel</h3>
          ${fracas.length || pfracas.length ? `${fracas.length ? `<p>Letras com mais erro: <b>${fracas.map(l => `${l} (${estado.letras[l].erros}✗/${estado.letras[l].acertos}✓)`).join(' · ')}</b></p>` : ''}${pfracas.length ? `<p>Palavras com mais erro: <b>${pfracas.join(', ')}</b></p>` : ''}
          <p style="color:var(--suave)">Sugestão: escrever a letra grande, falar o som dela e achar coisas da casa que começam com ela.</p>` : '<p>Ainda sem erros que se repetem.</p>'}
        </section>
        <section class="card">
          <h3>Mundos</h3>
          ${J.MUNDOS.map(mu => `<div class="linha"><b>${mu.icone} ${mu.n}. ${esc(mu.nome)}</b> — ${ab[mu.n] ? 'aberto' : 'fechado (' + esc(mu.requisito) + ')'}
            ${mu.n >= 3 ? `<label><input type="checkbox" data-forcar="${mu.n}" ${estado.forcados[mu.n] ? 'checked' : ''}> abrir agora</label>` : ''}</div>`).join('')}
        </section>
        <section class="card">
          <h3>Palavras</h3>
          <p><b>Já leu sozinha (${lidas.length}):</b> ${lidas.sort().join(', ') || '—'}</p>
          <p><b>Já dá para ler e ainda não leu (${naoLidas.length}):</b> ${naoLidas.map(w => w.p).join(', ') || '—'}</p>
        </section>
        <section class="card">
          <h3>Ajustes</h3>
          <div class="linha"><label>Missões por dia <select data-cfg="missoesPorDia">${[1, 2, 3, 4, 5].map(n => `<option ${estado.config.missoesPorDia === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
            <label>Perguntas por missão <select data-cfg="perguntasPorMissao">${[5, 6, 7, 8, 10, 12].map(n => `<option ${estado.config.perguntasPorMissao === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
            <label>Letras novas por dia (no máximo) <select data-cfg="novasPorDia">${[1, 2, 3, 4].map(n => `<option ${estado.config.novasPorDia === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
          <div class="linha"><label>Nome da criança <input type="text" id="cfg-nome" value="${esc(nome())}" maxlength="20"></label>
            <label>Nome do amigo <input type="text" id="cfg-amigo" value="${esc(amigo())}" maxlength="20"></label>
            <label><input type="checkbox" id="cfg-som" ${estado.prefs.som ? 'checked' : ''}> sons de festa</label>
            <label><input type="checkbox" id="cfg-voz" ${estado.prefs.voz ? 'checked' : ''}> voz ligada</label></div>
          <div class="acoes"><button class="bt" id="b-dar">Dar 10 bambus de presente</button></div>
        </section>
        <section class="card">
          <h3>Voz</h3>
          ${Voz.tem ? `<div class="linha"><label>Voz <select id="cfg-vozes"><option value="">automática (${esc(Voz.nomeAtual() || 'nenhuma em português')})</option>${vozes.map(v => `<option value="${esc(v.name)}" ${estado.prefs.vozNome === v.name ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></label>
            <label>Velocidade <input type="range" id="cfg-vel" min="0.6" max="1.2" step="0.05" value="${estado.prefs.velocidade}"></label>
            <button class="bt forte" id="b-testar">Testar</button></div>
            ${vozes.length ? '' : '<p style="color:#991b1b">Este aparelho não tem voz em português instalada. No Android: Configurações → Idioma → Saída de texto para fala → Google, português (Brasil).</p>'}`
          : '<p style="color:#991b1b">Este navegador não tem leitura em voz alta. Use o Chrome.</p>'}
          <p><b>Voz do papai (opcional):</b> a voz do navegador lê bem sílabas e palavras, mas não sabe fazer o som sozinho da letra (o "mmmm"). Grave aqui o SOM curtinho de cada letra (M = "mmmm", P = "p" sem o "ê", vogal = o som dela). Ele toca na apresentação da letra e na correção. Fica salvo só neste aparelho.</p>
          <div class="voz-grid">${J.SEQ.map(l => { const tem = !!Gravacoes.url('som:' + l); return `<div class="voz-item"><b>${l}</b><button class="bt" data-gravar="${l}">● gravar</button>${tem ? `<button class="bt" data-tocar="${l}">▶</button><button class="bt perigo" data-apagar="${l}">✕</button><span class="ok">ok</span>` : ''}</div>`; }).join('')}</div>
        </section>
        <section class="card">
          <h3>Histórico (14 dias)</h3>
          ${hist.length ? `<table><tr><th>dia</th><th>missões</th><th>perguntas</th><th>de primeira</th><th>bambus</th><th>letras firmes</th></tr>${hist.map(h => `<tr><td>${dataTxt(h.dia)}</td><td>${h.missoes}</td><td>${h.perguntas}</td><td>${Math.round(100 * h.dePrimeira / Math.max(1, h.perguntas))}%</td><td>${h.bambus}</td><td>${(h.letras || []).join(' ')}</td></tr>`).join('')}</table>` : '<p>Ainda sem histórico.</p>'}
        </section>
        <section class="card">
          <h3>Dados</h3>
          <p>O progresso fica salvo neste aparelho. Para trocar de aparelho: exporte aqui e importe no outro.</p>
          <div class="acoes"><button class="bt" id="b-exportar">Exportar progresso</button><label class="bt" style="cursor:pointer">Importar<input type="file" id="b-importar" accept=".json,application/json" hidden></label>
            <button class="bt" id="b-redescobrir">Refazer a descoberta de letras</button><button class="bt perigo" id="b-zerar">Zerar tudo</button></div>
        </section>
        <section class="card">
          <h3>Como o jogo ensina</h3>
          <p>Ensino explícito e em ordem da letra e do som (método fônico), com a sílaba simples do português (consoante + vogal) como porta de entrada, sempre terminando em palavra ou frase de verdade, com figura. A escrita (montar com sílabas e letras) ajuda a fixar a leitura. Ordem das letras: ${J.SEQ.join(' ')}. Cada letra nova só entra quando a anterior está firme. Errou: a pergunta volta 2 a 4 perguntas depois, até acertar. Não tem relógio, vidas nem som de erro.</p>
        </section>
      </div>`;
    $('#b-fechar').onclick = () => { painelLiberado = false; letraSel = null; ir('casa'); };
    $$('.painel .tile[data-l]').forEach(b => { b.onclick = () => { letraSel = letraSel === b.dataset.l ? null : b.dataset.l; renderPainel(); }; });
    $$('[data-acao]').forEach(b => {
      b.onclick = () => {
        const a = b.dataset.acao, l = letraSel;
        if (a === 'rever') return renderIntro(l, 'revisao', () => renderPainel());
        if (a === 'conhecida') J.marcarConhecida(estado, l, hoje());
        if (a === 'bloquear' && confirm(`Tirar a letra ${l}? Ela volta a ser apresentada como nova.`)) J.bloquearLetra(estado, l);
        if (a === 'fechar-letra') letraSel = null;
        salvar(); renderPainel();
      };
    });
    $$('[data-forcar]').forEach(c => { c.onchange = () => { estado.forcados[c.dataset.forcar] = c.checked; salvar(); renderPainel(); }; });
    $$('[data-cfg]').forEach(s => { s.onchange = () => { estado.config[s.dataset.cfg] = Number(s.value); J.garantirDia(estado, hoje()); salvar(); }; });
    $('#cfg-nome').onchange = ev => { estado.prefs.nome = ev.target.value.trim() || 'Duda'; salvar(); };
    $('#cfg-amigo').onchange = ev => { estado.prefs.amigo = ev.target.value.trim() || 'Panda'; salvar(); };
    $('#cfg-som').onchange = ev => { estado.prefs.som = ev.target.checked; salvar(); };
    $('#cfg-voz').onchange = ev => { estado.prefs.voz = ev.target.checked; salvar(); };
    $('#b-dar').onclick = () => { estado.bambus += 10; estado.bambusTotal += 10; salvar(); avisar('+10 bambus 🎋'); };
    if ($('#cfg-vozes')) {
      $('#cfg-vozes').onchange = ev => { estado.prefs.vozNome = ev.target.value; salvar(); Voz.escolher(); };
      $('#cfg-vel').onchange = ev => { estado.prefs.velocidade = Number(ev.target.value); salvar(); };
      $('#b-testar').onclick = () => Voz.seq([{ t: `Oi, ${nome()}! Bola, pato, macaco.` }, { t: J.falaSilaba('MA') }, { t: J.falaSilaba('PE') }]);
    }
    $$('[data-gravar]').forEach(b => { b.onclick = () => gravarSom(b.dataset.gravar, b); });
    $$('[data-tocar]').forEach(b => { b.onclick = () => Voz.seq([{ audio: Gravacoes.url('som:' + b.dataset.tocar) }]); });
    $$('[data-apagar]').forEach(b => { b.onclick = async () => { await Gravacoes.apagar('som:' + b.dataset.apagar); renderPainel(); }; });
    $('#b-exportar').onclick = () => {
      const blob = new Blob([JSON.stringify(estado, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'), d = new Date();
      a.href = URL.createObjectURL(blob); a.download = `joguinho-ler-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    $('#b-importar').onchange = ev => {
      const f = ev.target.files[0]; if (!f) return;
      f.text().then(t => { try { estado = J.validarImportacao(t); J.garantirDia(estado, hoje()); salvar(); avisar('Progresso importado'); renderPainel(); } catch (e) { alert(e.message); } });
    };
    $('#b-redescobrir').onclick = () => { if (!confirm('Refazer a descoberta de letras na próxima vez que ela tocar em BRINCAR? (as letras que já tem continuam)')) return; estado.descoberta.feita = false; estado.missaoAtiva = null; salvar(); avisar('A descoberta vai rodar de novo'); };
    $('#b-zerar').onclick = () => {
      if (!confirm('Zerar TODO o progresso (letras, palavras, bambus e roupinhas)?') || !confirm('Tem certeza? Não dá para desfazer.')) return;
      estado = J.estadoInicial(); J.garantirDia(estado, hoje()); salvar(); letraSel = null; avisar('Tudo zerado'); renderPainel();
    };
  }
  async function gravarSom(l, botao) {
    if (!navigator.mediaDevices || !window.MediaRecorder) { alert('Este navegador não grava áudio.'); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { alert('Sem permissão para usar o microfone.'); return; }
    const rec = new MediaRecorder(stream), partes = [];
    rec.ondataavailable = ev => { if (ev.data && ev.data.size) partes.push(ev.data); };
    const fim = new Promise(r => { rec.onstop = r; });
    botao.textContent = '● gravando…'; botao.disabled = true;
    rec.start();
    setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 2200);
    await fim;
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(partes, { type: rec.mimeType || 'audio/webm' });
    try { await Gravacoes.salvarSom('som:' + l, blob); } catch (e) { alert('Não consegui salvar a gravação neste aparelho.'); }
    renderPainel();
    Voz.seq([{ audio: Gravacoes.url('som:' + l) }]);
  }

  render();
})();
</script>
</body>
</html>
